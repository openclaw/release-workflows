name: Release source
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Validate and test without publishing
        default: true
        type: boolean
permissions: {}
jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      test-runs-on: xcode-27
      test-command: swift build -c release --jobs 2 && swift test --jobs 2
      source-archives: true
      # Optional: test-command writes one file to RELEASE_ASSET_PATH.
      # generated-asset: local-package-envelope.tar.gz
      # To consume qualified same-run input, depend on its producer and consumers:
      # generated-input-artifact-id: ${{ needs.producer.outputs.artifact-id }}
      # Validate RELEASE_ASSET_INPUT_DIR against the frozen checkout before wrapping.
      # Existing unprefixed catalogs: tag-prefix: '' (also change the push filter)
      # Optional branded title: release-name: Example Library
      # Go libraries: test-command: go test ./... and go-modules: '["."]'
      # Skill catalogs: use the catalog's validation command; omit go-modules.
      # require-signed-tag: true
      # homebrew-formula: example-library
    # secrets:
    #   TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
