    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Verify npm signatures and provenance independently
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        EXPECTED_TAG_OBJECT: "${{ needs.tag.outputs.tag-object-sha }}"
        PAYLOAD: "${{ runner.temp }}/payload"
        CALLER_WORKFLOW: "${{ github.workflow_ref }}"
      run: |
        set -euo pipefail
        unset NODE_AUTH_TOKEN NPM_TOKEN GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
        export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/empty.npmrc"
        export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
        : > "$NPM_CONFIG_USERCONFIG"
        node <<'JS'
        (async () => {
        const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto'),assert=require('node:assert/strict');
        const plan=JSON.parse(fs.readFileSync(path.join(process.env.PAYLOAD,'PACKAGE-PLAN.json')));
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));
        const get=async url=>{const u=new URL(url);assert.equal(u.protocol,'https:');assert.equal(u.hostname,'registry.npmjs.org');const r=await fetch(u,{signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error(`registry HTTP ${r.status}`);return r.json();};
        for(const p of plan){
          const deadline=Date.now()+10*60*1000;let m,attestations;
          while(true){
            m=await get('https://registry.npmjs.org/'+encodeURIComponent(p.name)+'/'+p.version);
            if(m.dist?.attestations?.url){try{attestations=await get(m.dist.attestations.url);}catch{}}
            if(attestations)break;
            if(Date.now()>=deadline)throw new Error('npm provenance visibility deadline exceeded');
            await sleep(10000);
          }
          const bytes=fs.readFileSync(path.join(process.env.PAYLOAD,p.file));
          const digest=crypto.createHash('sha512').update(bytes).digest('hex');
          assert.equal(m.dist.integrity,'sha512-'+Buffer.from(digest,'hex').toString('base64'));
          const caller=process.env.CALLER_WORKFLOW.split('@')[0];
          const valid=attestations.attestations.some(a=>{
            if(a.predicateType!=='https://slsa.dev/provenance/v1')return false;
            const s=JSON.parse(Buffer.from(a.bundle.dsseEnvelope.payload,'base64').toString());
            const b=s.predicate?.buildDefinition,w=b?.externalParameters?.workflow;
            return s.predicateType==='https://slsa.dev/provenance/v1' && s.subject?.some(x=>x.digest?.sha512===digest) &&
              w?.repository==='https://github.com/'+process.env.GITHUB_REPOSITORY &&
              caller===process.env.GITHUB_REPOSITORY+'/'+w?.path &&
              b?.resolvedDependencies?.some(x=>x.digest?.gitCommit===process.env.TARGET_SHA);
          });
          assert.ok(valid,'provenance does not bind exact package bytes, caller workflow and frozen commit');
          const cwd=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'provenance-'));
          fs.writeFileSync(path.join(cwd,'package.json'),'{"private":true}');
          cp.execFileSync('npm',['install','--ignore-scripts','--no-audit','--registry=https://registry.npmjs.org',p.name+'@'+p.version],{cwd,stdio:'inherit'});
          // npm verifies the Sigstore signature and transparency proof, not just the decoded predicate.
          cp.execFileSync('npm',['audit','signatures','--registry=https://registry.npmjs.org'],{cwd,stdio:'inherit'});
        }
        })().catch(error => { console.error(error.message); process.exitCode=1; });
