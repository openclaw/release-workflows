name: Crabbox Release Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    name: Release Check
    if: github.repository == 'openclaw/crabbox'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out target merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = openclaw/crabbox
          test "$GITHUB_BASE_REF" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Determine snapshot requirement
        id: admission
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          docs_only() {
            test "$GITHUB_EVENT_NAME" = pull_request || return 1
            test "$PR_BASE_REPOSITORY" = "$GITHUB_REPOSITORY" || return 1
            test "$PR_BASE_REF" = "$GITHUB_BASE_REF" || return 1
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || return 1
            test "$GITHUB_REF" = "refs/pull/$PR_NUMBER/merge" || return 1
            for sha in "$PR_BASE_SHA" "$PR_HEAD_SHA" "$GITHUB_SHA"; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              git cat-file -e "$sha^{commit}" || return 1
            done
            parents="$(git show -s --format=%P "$GITHUB_SHA")" || return 1
            test "$parents" = "$PR_BASE_SHA $PR_HEAD_SHA" || return 1

            # Compare the checked-out merge tree, including base changes since PR branching.
            # pipefail keeps a failed/partial Git diff from granting the exemption.
            git diff --raw --no-abbrev --no-ext-diff --no-textconv --no-renames \
              --ignore-submodules=none -z "$PR_BASE_SHA" "$GITHUB_SHA" -- | (
              changed=0
              while IFS= read -r -d '' record; do
                IFS= read -r -d '' path || exit 1
                [[ "$record" =~ ^:(100644|100755|000000)\ (100644|100755|000000)\ [0-9a-f]{40}\ [0-9a-f]{40}\ [AMD]$ ]] || exit 1
                # Remove an exemption through protected CODEOWNER review before a path
                # becomes a compilation, embed, hook, archive, or release-notes input.
                case "$path" in
                  docs/*|README.md|CHANGELOG.md) ;;
                  *) exit 1 ;;
                esac
                changed=1
              done
              test -z "$record" && test "$changed" = 1
            )
          }
          snapshot_required=1
          if docs_only; then
            snapshot_required=0
          fi
          echo "snapshot-required=$snapshot_required" >> "$GITHUB_OUTPUT"
          echo "Snapshot required: $snapshot_required (only verified docs-only changes are exempt)"

      - name: Set up Go
        if: steps.admission.outputs.snapshot-required != '0'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Snapshot release build
        if: steps.admission.outputs.snapshot-required != '0'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --parallelism 1

      - name: Verify snapshot helper embeds VM daemon
        if: steps.admission.outputs.snapshot-required != '0'
        shell: bash
        run: |
          set -euo pipefail
          helper="$(find dist -type f -name crabbox-apple-vm-helper -print -quit)"
          if [ -z "$helper" ] || [ ! -x "$helper" ]; then
            echo "::error::snapshot Apple VM helper not found"
            exit 1
          fi
          if ! "$helper" vmd-info | grep -q '"embedded":true'; then
            echo "::error::snapshot Apple VM helper is missing the embedded VM daemon"
            exit 1
          fi
