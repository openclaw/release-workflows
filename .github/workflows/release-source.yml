---
name: Release source
'on':
  workflow_call:
    inputs:
      version:
        description: SemVer release version, with optional v
        required: true
        type: string
      tag-prefix:
        description: Version tag prefix, either v or empty for existing unprefixed catalogs
        required: false
        default: v
        type: string
      release-name:
        description: Optional project name placed before the version in the release title
        required: false
        default: ''
        type: string
      dry_run:
        description: Validate, build and verify without creating tags or publishing
        required: false
        default: true
        type: boolean
      require-signed-tag:
        description: Require SSH signature using frozen .github/release-allowed-signers
        required: false
        default: false
        type: boolean
      strict-checks:
        description: Require all independent CI signals
        required: false
        default: false
        type: boolean
      ci-check-events:
        description: Eligible Actions events; push CI only by default
        required: false
        default: '["push"]'
        type: string
      test-runs-on:
        description: GitHub-hosted runner for the credential-free caller tests
        required: false
        default: ubuntu-latest
        type: string
      test-command:
        description: Optional credential-free caller test command
        required: false
        default: ''
        type: string
      homebrew-tap:
        description: Optional tap owner/repo
        required: false
        default: openclaw/homebrew-tap
        type: string
      homebrew-formula:
        description: Optional source/npm formula handoff; empty disables
        required: false
        default: ''
        type: string
      source-archives:
        description: Attach checksum-verified GitHub archives of the frozen commit
        required: false
        default: false
        type: boolean
      go-modules:
        description: JSON array of Go module directories to warm and verify; empty
          disables
        required: false
        default: "[]"
        type: string
    secrets:
      TAP_TOKEN:
        description: Optional configured tap dispatch token
        required: false
    outputs:
      release-url:
        description: Verified GitHub release URL
        value: "${{ jobs.publish.outputs.release-url }}"
permissions: {}
concurrency:
  group: release-source-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    name: 1 · Validate frozen source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    outputs:
      default-branch: "${{ steps.repository.outputs.default-branch }}"
      release-notes-artifact-name: "${{ steps.metadata.outputs.release-notes-artifact-name
        }}"
      release-version: "${{ steps.inputs.outputs.release-version }}"
      tag: "${{ steps.inputs.outputs.tag }}"
      tag-object-sha: "${{ steps.repository.outputs.tag-object-sha }}"
      target-sha: "${{ steps.repository.outputs.target-sha }}"
      metadata-id: "${{ steps.notes-upload.outputs.artifact-id }}"
      metadata-digest: "${{ steps.notes-upload.outputs.artifact-digest }}"
    steps:
    - name: Validate inputs
      id: inputs
      env:
        TEST_RUNS_ON: "${{ inputs.test-runs-on }}"
        SOURCE_ARCHIVES: "${{ inputs.source-archives }}"
        VERSION: "${{ inputs.version }}"
        TAG_PREFIX: "${{ inputs.tag-prefix }}"
        GO_MODULES: "${{ inputs.go-modules }}"
        HOMEBREW_TAP: "${{ inputs.homebrew-tap }}"
        HOMEBREW_FORMULA: "${{ inputs.homebrew-formula }}"
      run: |
        set -euo pipefail
        case "${TAG_PREFIX-v}" in
          v|'') ;;
          *) echo 'tag-prefix must be v or empty' >&2; exit 1 ;;
        esac
        [[ "${TAG_PREFIX-v}" == v || "${GO_MODULES-[]}" == '[]' ]] || { echo 'Go modules require v-prefixed tags'; exit 1; }
        case "$TEST_RUNS_ON" in
          ubuntu-latest|ubuntu-24.04|ubuntu-24.04-arm|macos-latest|macos-15|macos-15-intel|macos-26) ;;
          *) echo 'test-runs-on must select a supported GitHub-hosted runner' >&2; exit 1 ;;
        esac
        [[ -z "$HOMEBREW_FORMULA" || "$SOURCE_ARCHIVES" == true ]] || { echo 'enable source-archives for Homebrew handoff'; exit 1; }
        v=$(printf '%s'  "$VERSION" | sed 's/^v//')
        [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo 'invalid release SemVer'; exit 1; }
        [[ "$HOMEBREW_TAP" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || exit 1
        [[ -z "$HOMEBREW_FORMULA" || "$HOMEBREW_FORMULA" =~ ^[A-Za-z0-9][A-Za-z0-9+_.@-]*$ ]] || exit 1
        python3 - "$v" <<'SEMVER'
        import sys
        pre=sys.argv[1].partition('-')[2]
        if any(x.isdigit() and len(x)>1 and x.startswith('0') for x in pre.split('.')): raise SystemExit('numeric prerelease identifiers cannot have leading zeros')
        SEMVER
        printf 'release-version=%s\ntag=%s%s\n' "$v" "${TAG_PREFIX-v}" "$v" >> "$GITHUB_OUTPUT"
    - name: Resolve protected release target
      id: repository
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TAG: "${{ steps.inputs.outputs.tag }}"
        DRY_RUN: "${{ inputs.dry_run }}"
      with:
        script: |
          const repo = await github.rest.repos.get(context.repo);
          const branchName = repo.data.default_branch;
          const branch = await github.rest.repos.getBranch({
            ...context.repo,
            branch: branchName,
          });
          if (!branch.data.protected) {
            core.setFailed(`default branch ${branchName} is not protected`);
            return;
          }
          const branchHead = branch.data.commit.sha;
          if (context.ref !== `refs/tags/${process.env.TAG}` && (context.ref !== `refs/heads/${branchName}` || context.sha !== branchHead)) {
            core.setFailed(`caller must run at protected ${branchName} head ${branchHead}; got ${context.ref}@${context.sha}`);
            return;
          }

          // A dispatch proof must exercise the checked-out main revision, even after release.
          if (process.env.DRY_RUN === 'true' && context.ref === `refs/heads/${branchName}`) {
            core.setOutput('default-branch', branchName);
            core.setOutput('tag-object-sha', '');
            core.setOutput('target-sha', branchHead);
            core.setOutput('target-source', 'protected-head');
            return;
          }

          let targetSha = branchHead;
          let targetSource = 'protected-head';
          let tagObjectSha = '';
          let existingTag = null;
          try {
            existingTag = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${process.env.TAG}`,
            });
          } catch (error) {
            if (error.status !== 404) throw error;
          }

          if (existingTag !== null) {
            if (existingTag.data.object.type !== 'tag') {
              core.setFailed(`existing tag is lightweight, not annotated: ${process.env.TAG}`);
              return;
            }
            tagObjectSha = existingTag.data.object.sha;
            const tagObject = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: tagObjectSha,
            });
            if (tagObject.data.object.type !== 'commit') {
              core.setFailed(`annotated tag does not peel directly to a commit: ${process.env.TAG}`);
              return;
            }
            targetSha = tagObject.data.object.sha;
            targetSource = 'annotated-tag';

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${targetSha}...${branchHead}`,
              per_page: 1,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed(`tag commit ${targetSha} is not reachable from protected ${branchName} head ${branchHead}`);
              return;
            }
            core.info(`retry target frozen by annotated tag ${process.env.TAG} at ${targetSha}`);
          } else {
            core.info(`first-attempt target is protected ${branchName} head ${branchHead}`);
          }
          core.setOutput('default-branch', branchName);
          core.setOutput('tag-object-sha', tagObjectSha);
          core.setOutput('target-sha', targetSha);
          core.setOutput('target-source', targetSource);

          if (context.ref.startsWith('refs/tags/') && (existingTag === null || context.sha !== targetSha)) throw new Error('tag event does not match frozen commit');
    - name: Check out exact release target
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: "${{ inputs.require-signed-tag && !(inputs.dry_run && github.event_name == 'workflow_dispatch') && steps.inputs.outputs.tag || steps.repository.outputs.target-sha
          }}"
    - name: Verify required SSH-signed tag
      if: inputs.require-signed-tag && !(inputs.dry_run && github.event_name == 'workflow_dispatch')
      env:
        TAG: "${{ steps.inputs.outputs.tag }}"
        TARGET_SHA: "${{ steps.repository.outputs.target-sha }}"
      run: |
        set -euo pipefail
        policy=.github/release-allowed-signers
        [[ -f "$policy" && ! -L "$policy" && -s "$policy" ]] || {
          echo "$policy must be a nonempty regular file when require-signed-tag is enabled" >&2
          exit 1
        }
        [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] || {
          echo "$TAG must be an annotated SSH-signed tag" >&2
          exit 1
        }
        [[ "$(git rev-parse "refs/tags/$TAG^{}")" == "$TARGET_SHA" ]] || {
          echo "$TAG does not peel to the frozen target" >&2
          exit 1
        }
        git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$policy" verify-tag "$TAG"
    - name: Validate release metadata
      id: metadata
      env:
        RELEASE_VERSION: "${{ steps.inputs.outputs.release-version }}"
        PACKAGE_DIRS: "[]"
      run: |
        set -euo pipefail
        python3 - "$RELEASE_VERSION" "$RUNNER_TEMP/RELEASE-NOTES.md" <<'PY'
        from pathlib import Path
        import re
        import sys

        version, output = sys.argv[1:]
        raw = Path("CHANGELOG.md").read_bytes()
        text = raw.decode("utf-8")
        version_pattern = re.compile(rf"(?<![0-9A-Za-z.])v?{re.escape(version)}(?![0-9A-Za-z.+-])")
        date_pattern = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")
        heading_pattern = re.compile(r"^##[ \t]+")
        fence_pattern = re.compile(r"^[ ]{0,3}(`{3,}|~{3,})")
        def fence_marker(content):
            opening = fence_pattern.match(content)
            if opening and (opening.group(1)[0] == "~" or "`" not in content[opening.end():]):
                return opening.group(1)
            return None

        def paragraph_tail(start):
            tail = text[start:]
            boundary = re.search(r"\n(?:[ \t]*\r?\n|[ ]{0,3}#{1,6}(?:[ \t]|$)|[ ]{0,3}<!--)", tail, re.M)
            if boundary:
                tail = tail[:boundary.start()]
            for candidate in re.finditer(r"\n([^\r\n]*)", tail):
                if fence_marker(candidate.group(1)):
                    return tail[:candidate.start()]
            return tail

        headings = []
        offset = 0
        fence = None
        in_comment = False
        inline_end = -1
        for line in text.splitlines(keepends=True):
            content = line.rstrip("\r\n")
            if fence is not None:
                closing = re.match(rf"^[ ]{{0,3}}{re.escape(fence[0])}{{{fence[1]},}}[ \t]*$", content)
                if closing:
                    fence = None
                offset += len(line)
                continue

            if not in_comment:
                opening = fence_marker(content)
                if opening:
                    fence = (opening[0], len(opening))
                    offset += len(line)
                    continue
                if heading_pattern.match(content):
                    headings.append((offset, offset + len(line), content))

            cursor = 0
            while cursor < len(content):
                if in_comment:
                    closing = content.find("-->", cursor)
                    if closing < 0:
                        break
                    in_comment = False
                    cursor = closing + 3
                elif offset + cursor < inline_end:
                    cursor = min(len(content), inline_end - offset)
                elif content[cursor] == "\\":
                    cursor += 2
                elif content[cursor] == "`":
                    marker = re.match(r"`+", content[cursor:]).group()
                    tail_start = offset + cursor + len(marker)
                    tail = paragraph_tail(tail_start)
                    closing = re.search(r"(?<!`)" + marker + r"(?!`)", tail)
                    if closing:
                        inline_end = tail_start + closing.end()
                    cursor += len(marker)
                elif content.startswith("<!--", cursor):
                    block_start = cursor <= 3 and content[:cursor] == " " * cursor
                    if content.startswith("<!--->", cursor):
                        cursor += 6
                    elif content.startswith("<!-->", cursor):
                        cursor += 5
                    elif block_start:
                        in_comment = True
                        cursor += 4
                    else:
                        tail_start = offset + cursor + 4
                        closing = paragraph_tail(tail_start).find("-->")
                        if closing >= 0:
                            inline_end = tail_start + closing + 3
                        cursor += 4
                else:
                    cursor += 1
            offset += len(line)

        matches = [
            candidate
            for candidate in headings
            if version_pattern.search(candidate[2]) and date_pattern.search(candidate[2])
        ]
        if len(matches) != 1:
            raise SystemExit(
                f"CHANGELOG.md needs exactly one dated level-two section for {version}; found {len(matches)}"
            )
        match = matches[0]
        end = next((candidate[0] for candidate in headings if candidate[0] > match[0]), len(text))
        section = text[match[0]:end]
        Path(output).write_bytes(section.encode("utf-8"))
        PY

        python3 - <<'PYDATE'
        import datetime, pathlib, re
        heading=pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'RELEASE-NOTES.md').read_text().splitlines()[0]
        datetime.date.fromisoformat(re.search(r'[0-9]{4}-[0-9]{2}-[0-9]{2}',heading)[0])
        PYDATE

        python3 - <<'PYVERSION'
        import json, os, pathlib
        p=pathlib.Path('package.json')
        if p.exists():
            m=json.loads(p.read_text())
            if 'version' in m and m['version']!=os.environ['RELEASE_VERSION']: raise SystemExit('package.json version mismatch')
        PYVERSION
        for file in .release-version VERSION version.txt; do
          [[ ! -f "$file" ]] || [[ "$(tr -d '[:space:]' < "$file" | sed 's/^v//')" == "$RELEASE_VERSION" ]] || exit 1
        done
        echo "release-notes-artifact-name=source-notes-$RELEASE_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload frozen release notes
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.metadata.outputs.release-notes-artifact-name }}"
        path: "${{ runner.temp }}/RELEASE-NOTES.md"
        if-no-files-found: error
        retention-days: 30
      id: notes-upload
    - name: Validate public Go module paths
      env:
        GO_MODULES: "${{ inputs.go-modules }}"
        RELEASE_VERSION: "${{ steps.inputs.outputs.release-version }}"
      run: |-
        python3 - <<'PYGO'
        import json, os, pathlib, re
        root=pathlib.Path.cwd().resolve(); dirs=json.loads(os.environ['GO_MODULES'])
        if not isinstance(dirs,list) or not all(isinstance(d,str) for d in dirs) or len(set(dirs))!=len(dirs): raise SystemExit('go-modules must contain unique directories')
        for d in dirs:
            p=root/d
            if (d!='.' and not re.fullmatch(r'[A-Za-z0-9_-][A-Za-z0-9._/-]*',d)) or '..' in pathlib.PurePosixPath(d).parts or p.resolve()!=p: raise SystemExit('unsafe module directory')
            f=p/'go.mod'
            if f.is_symlink(): raise SystemExit('go.mod must be regular')
            modules=re.findall(r'^module\s+(?:"([^"]+)"|(\S+))\s*$',f.read_text(),re.M)
            if len(modules)!=1: raise SystemExit('go.mod must declare exactly one module')
            module=next(v for v in modules[0] if v)
            major=int(os.environ['RELEASE_VERSION'].split('.')[0]);suffix=re.search(r'/v([2-9][0-9]*)$',module)
            if major>=2 and (not suffix or int(suffix[1])!=major): raise SystemExit('Go module major suffix must match release version')
        PYGO
    - name: Verify Go submodule tags before publication
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        GO_MODULES: "${{ inputs.go-modules }}"
        TAG: "${{ steps.inputs.outputs.tag }}"
        TARGET_SHA: "${{ steps.repository.outputs.target-sha }}"
      with:
        script: |-
          for (const dir of JSON.parse(process.env.GO_MODULES)) {
            if (dir === '.') continue;
            const ref=await github.rest.git.getRef({...context.repo,ref:'tags/'+dir+'/'+process.env.TAG});
            if(ref.data.object.type!=='tag') throw new Error('Go submodule tag must be annotated');
            const tag=await github.rest.git.getTag({...context.repo,tag_sha:ref.data.object.sha});
            if(tag.data.object.type!=='commit'||tag.data.object.sha!==process.env.TARGET_SHA) throw new Error('Go submodule tag differs from frozen source');
          }
    - name: Require independent CI green on frozen target
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        CI_CHECK_EVENTS: "${{ inputs.ci-check-events }}"
        DEFAULT_BRANCH: "${{ steps.repository.outputs.default-branch }}"
        STRICT_CHECKS: "${{ inputs.strict-checks }}"
        TARGET_SHA: "${{ steps.repository.outputs.target-sha }}"
      with:
        script: |
          const acceptableConclusions = new Set(['success', 'neutral', 'skipped']);
          const currentRunId = context.runId;
          const allowedCheckEvents = new Set(JSON.parse(process.env.CI_CHECK_EVENTS));
          const normalizeContext = (name) => name.toLowerCase();
          // ci-check-event-filter-begin
          const filterCheckRunsByEvent = ({ checkRuns, allowedEvents, currentRunId, workflowRunEvents, info }) => {
            const accepted = [];
            for (const check of checkRuns) {
              const match = check.details_url?.match(/\/actions\/runs\/(\d+)(?:\/|$)/);
              if (match?.[1] === String(currentRunId)) continue;
              if (allowedEvents.size > 0) {
                if (match && workflowRunEvents.has(Number(match[1]))) {
                  const runId = Number(match[1]);
                  const event = workflowRunEvents.get(runId);
                  if (!allowedEvents.has(event)) {
                    info(`Ignoring ${check.name} from Actions event ${event}`);
                    continue;
                  }
                }
              }
              accepted.push(check);
            }
            return accepted;
          };
          // ci-check-event-filter-end
          // ci-check-gate-helpers-begin
          const evaluateAllChecks = ({ checkRuns, latestStatuses, acceptableConclusions }) => {
            const pending = [];
            const failures = [];
            if (checkRuns.length === 0 && latestStatuses.size === 0) {
              pending.push('no independent CI check or commit status');
            }
            for (const check of checkRuns) {
              const observed = `${check.name}=${check.status}/${check.conclusion}`;
              if (check.status !== 'completed') {
                pending.push(observed);
              } else if (!acceptableConclusions.has(check.conclusion)) {
                failures.push(observed);
              }
            }
            for (const status of latestStatuses.values()) {
              if (status.state === 'success') continue;
              const observed = `${status.context}=status/${status.state}`;
              if (status.state === 'pending') {
                pending.push(observed);
              } else {
                failures.push(observed);
              }
            }
            if (failures.length > 0) return { state: 'failure', mode: 'all', observed: failures };
            if (pending.length > 0) return { state: 'pending', mode: 'all', observed: pending };
            return { state: 'success', mode: 'all', observed: [] };
          };
          const evaluateRequiredChecks = async ({
            required,
            checkRuns,
            allStatuses,
            latestStatuses,
            acceptableConclusions,
            normalizeContext,
            statusAppId,
          }) => {
            const pending = [];
            const failures = [];
            for (const requirement of required.values()) {
              const matchingRuns = checkRuns.filter((check) =>
                normalizeContext(check.name) === requirement.normalizedName &&
                (requirement.appId === null || check.app?.id === requirement.appId)
              );
              let matchingStatus = latestStatuses.get(requirement.normalizedName);
              if (matchingStatus && requirement.appId !== null &&
                  await statusAppId(matchingStatus) !== requirement.appId) {
                matchingStatus = undefined;
                for (const status of allStatuses) {
                  if (normalizeContext(status.context) === requirement.normalizedName &&
                      await statusAppId(status) === requirement.appId) {
                    matchingStatus = status;
                    break;
                  }
                }
              }
              const requirementName = `${requirement.name}${requirement.appId === null ? '' : `@app:${requirement.appId}`}`;
              if (matchingRuns.length === 0 && matchingStatus === undefined) {
                pending.push(`${requirementName}=missing`);
                continue;
              }
              for (const check of matchingRuns) {
                const observed = `${requirementName}=${check.status}/${check.conclusion}`;
                if (check.status !== 'completed') {
                  pending.push(observed);
                } else if (!acceptableConclusions.has(check.conclusion)) {
                  failures.push(observed);
                }
              }
              if (matchingStatus !== undefined && matchingStatus.state !== 'success') {
                const observed = `${requirementName}=status/${matchingStatus.state}`;
                if (matchingStatus.state === 'pending') {
                  pending.push(observed);
                } else {
                  failures.push(observed);
                }
              }
            }
            if (failures.length > 0) return { state: 'failure', mode: 'required', observed: failures };
            if (pending.length > 0) return { state: 'pending', mode: 'required', observed: pending };
            return { state: 'success', mode: 'required', observed: [] };
          };
          const evaluateCiGate = async ({
            required,
            strictChecks,
            checkRuns,
            allStatuses,
            latestStatuses,
            acceptableConclusions,
            normalizeContext,
            statusAppId,
          }) => {
            let requiredResult = null;
            if (required.size > 0) {
              requiredResult = await evaluateRequiredChecks({
                required,
                checkRuns,
                allStatuses,
                latestStatuses,
                acceptableConclusions,
                normalizeContext,
                statusAppId,
              });
              if (!strictChecks) return requiredResult;
            }
            const allResult = evaluateAllChecks({ checkRuns, latestStatuses, acceptableConclusions });
            if (requiredResult?.state === 'failure') return requiredResult;
            if (allResult.state === 'failure') return allResult;
            if (requiredResult?.state === 'pending') return requiredResult;
            return allResult;
          };
          const waitForCiGate = async ({
            loadEvaluation,
            timeoutMs,
            intervalMs,
            now,
            sleep,
            info,
          }) => {
            const deadline = now() + timeoutMs;
            while (true) {
              const evaluation = await loadEvaluation();
              if (evaluation.state !== 'pending') return evaluation;
              const remainingMs = deadline - now();
              if (remainingMs <= 0) return { ...evaluation, state: 'failure', timedOut: true };
              const delayMs = Math.min(intervalMs, remainingMs);
              info(`CI checks pending: ${evaluation.observed.join(', ')}; retrying in ${Math.ceil(delayMs / 1000)}s`);
              await sleep(delayMs);
            }
          };
          // ci-check-gate-helpers-end

          const required = new Map();
          const addRequired = (name, appId = null) => {
            if (!name) return;
            const normalizedName = normalizeContext(name);
            const normalizedAppId = Number.isInteger(appId) && appId >= 0 ? appId : null;
            if (normalizedAppId !== null) {
              required.delete(`${normalizedName}\u0000*`);
            } else if ([...required.values()].some((entry) =>
              entry.normalizedName === normalizedName && entry.appId !== null)) {
              return;
            }
            required.set(`${normalizedName}\u0000${normalizedAppId ?? '*'}`, {
              name,
              normalizedName,
              appId: normalizedAppId,
            });
          };
          const addRequiredStatusChecks = (policy) => {
            if (!policy) return;
            const checks = policy.checks ?? [];
            for (const check of checks) addRequired(check.context, check.app_id);
            for (const name of policy.contexts ?? []) {
              if (![...required.values()].some((entry) =>
                entry.normalizedName === normalizeContext(name))) addRequired(name);
            }
          };

          const branch = await github.rest.repos.getBranch({
            ...context.repo,
            branch: process.env.DEFAULT_BRANCH,
          });
          const projectedPolicy = branch.data.protection?.required_status_checks;
          addRequiredStatusChecks(projectedPolicy);

          const effectiveRules = await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
            ...context.repo,
            branch: process.env.DEFAULT_BRANCH,
            per_page: 100,
          });
          for (const rule of effectiveRules) {
            if (rule.type !== 'required_status_checks') continue;
            for (const check of rule.parameters?.required_status_checks ?? []) {
              addRequired(check.context, check.integration_id);
            }
          }

          const strictChecks = process.env.STRICT_CHECKS === 'true';
          const appIdsByBotLogin = new Map();
          const statusAppId = async (status) => {
            const login = status.creator?.login;
            if (status.creator?.type !== 'Bot' || !login?.endsWith('[bot]')) return null;
            if (!appIdsByBotLogin.has(login)) {
              const slug = login.slice(0, -'[bot]'.length);
              appIdsByBotLogin.set(login, github.rest.apps.getBySlug({ app_slug: slug })
                .then((response) => response.data.id)
                .catch((error) => {
                  if (error.status === 404) return null;
                  throw error;
                }));
            }
            return appIdsByBotLogin.get(login);
          };
          if (required.size > 0) {
            core.info(`Required CI contexts: ${[...required.values()].map((entry) => entry.name).join(', ')}`);
          }

          if (required.size === 0 || strictChecks) {
            core.info(`CI gate mode: ${strictChecks ? 'strict all-checks' : 'all-check fallback (no required contexts)'}`);
          }

          const loadSignals = async () => {
            const allCheckRuns = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: process.env.TARGET_SHA,
              per_page: 100,
              filter: 'latest',
            });
            const workflowRunEvents = new Map();
            if (allowedCheckEvents.size > 0) {
              try {
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  ...context.repo,
                  head_sha: process.env.TARGET_SHA,
                  per_page: 100,
                });
                for (const run of workflowRuns) workflowRunEvents.set(run.id, run.event);
              } catch (error) {
                core.warning(`Could not resolve Actions events for CI filtering; retaining all checks: ${error.message}`);
              }
            }
            const checkRuns = filterCheckRunsByEvent({
              checkRuns: allCheckRuns,
              allowedEvents: allowedCheckEvents,
              currentRunId,
              workflowRunEvents,
              info: (message) => core.info(message),
            });
            const allStatuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              ...context.repo,
              ref: process.env.TARGET_SHA,
              per_page: 100,
            });
            const latestStatuses = new Map();
            for (const status of allStatuses) {
              const normalizedContext = normalizeContext(status.context);
              if (!latestStatuses.has(normalizedContext)) latestStatuses.set(normalizedContext, status);
            }
            return { checkRuns, allStatuses, latestStatuses };
          };

          const result = await waitForCiGate({
            loadEvaluation: async () => {
              const signals = await loadSignals();
              return evaluateCiGate({
                required,
                strictChecks,
                ...signals,
                acceptableConclusions,
                normalizeContext,
                statusAppId,
              });
            },
            timeoutMs: 15 * 60 * 1000,
            intervalMs: 10 * 1000,
            now: () => Date.now(),
            sleep: (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs)),
            info: (message) => core.info(message),
          });
          if (result.state === 'failure') {
            const prefix = result.timedOut
              ? (result.mode === 'required' ? 'timed out waiting for required checks' : 'timed out waiting for CI checks')
              : (result.mode === 'required' ? 'required checks not green' : 'non-green checks');
            core.setFailed(`${prefix}: ${result.observed.join(', ')}`);
          }
  tag:
    name: 2 · Freeze annotated tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create immutable annotated tag
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        EXPECTED_TAG_OBJECT: "${{ needs.validate.outputs.tag-object-sha }}"
        REPOSITORY_TYPE: source
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        DRY_RUN: "${{ inputs.dry_run }}"
      with:
        script: |
          if (process.env.DRY_RUN === 'true') { core.info('dry run: no tag created or changed'); return; }
          let existing = null;
          try {
            existing = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
          } catch (error) {
            if (error.status !== 404) throw error;
          }

          if (process.env.EXPECTED_TAG_OBJECT !== '') {
            if (existing === null) {
              core.setFailed(`tag disappeared after validation: ${process.env.TAG}`);
              return;
            }
            if (existing.data.object.type !== 'tag') {
              core.setFailed(`existing tag is lightweight, not signed or annotated: ${process.env.TAG}`);
              return;
            }
            if (existing.data.object.sha !== process.env.EXPECTED_TAG_OBJECT) {
              core.setFailed(`tag object changed after validation: ${process.env.TAG}`);
              return;
            }
            const tagObject = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: process.env.EXPECTED_TAG_OBJECT,
            });
            if (tagObject.data.object.type !== 'commit' || tagObject.data.object.sha !== process.env.TARGET_SHA) {
              core.setFailed(`existing tag does not freeze ${process.env.TARGET_SHA}`);
              return;
            }
            core.setOutput('tag-object-sha', existing.data.object.sha);
            core.info(`reusing exact signed or annotated tag ${process.env.TAG}`);
            return;
          }

          if (existing !== null) {
            core.setFailed(`tag appeared after validation: ${process.env.TAG}`);
            return;
          }
          const tagObject = await github.rest.git.createTag({
            ...context.repo,
            tag: process.env.TAG,
            message: `Release ${process.env.TAG}\n\nFleet policy: ${process.env.REPOSITORY_TYPE}; annotated by openclaw/release-workflows.`,
            object: process.env.TARGET_SHA,
            type: 'commit',
            tagger: {
              name: 'github-actions[bot]',
              email: '41898282+github-actions[bot]@users.noreply.github.com',
              date: new Date().toISOString(),
            },
          });
          await github.rest.git.createRef({
            ...context.repo,
            ref: `refs/tags/${process.env.TAG}`,
            sha: tagObject.data.sha,
          });

          core.setOutput('tag-object-sha', tagObject.data.sha);
      id: freeze
    outputs:
      tag-object-sha: "${{ steps.freeze.outputs.tag-object-sha }}"
  build:
    needs:
    - validate
    - tag
    runs-on: "${{ inputs.test-runs-on }}"
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-name: "${{ steps.artifact.outputs.name }}"
      artifact-id: "${{ steps.raw-upload.outputs.artifact-id }}"
      artifact-digest: "${{ steps.raw-upload.outputs.artifact-digest }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ needs.validate.outputs.target-sha }}"
        persist-credentials: false
    - name: Run caller tests without write credentials
      env:
        TEST_COMMAND: "${{ inputs.test-command }}"
      run: |-
        set -euo pipefail
        unset NODE_AUTH_TOKEN NPM_TOKEN GH_TOKEN GITHUB_TOKEN
        bash -e -o pipefail -c "$TEST_COMMAND"
        mkdir "$RUNNER_TEMP/raw"
        echo verified > "$RUNNER_TEMP/raw/tests-passed"
    - id: artifact
      run: echo "name=source-raw-${{ needs.validate.outputs.tag }}-${{ github.run_id
        }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.artifact.outputs.name }}"
        path: "${{ runner.temp }}/raw"
        if-no-files-found: error
        retention-days: 30
      id: raw-upload
  assemble:
    needs:
    - validate
    - tag
    - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: "${{ steps.artifact.outputs.name }}"
      artifact-id: "${{ steps.payload-upload.outputs.artifact-id }}"
      artifact-digest: "${{ steps.payload-upload.outputs.artifact-digest }}"
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/payload"
        artifact-ids: "${{ needs.validate.outputs.metadata-id }}"
        merge-multiple: true
    - name: Download frozen GitHub source archives
      if: inputs.source-archives
      env:
        GH_TOKEN: "${{ github.token }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
      run: |-
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/tarball/$TARGET_SHA" > "$RUNNER_TEMP/payload/source-$RELEASE_VERSION.tar.gz"
        gh api "repos/$GITHUB_REPOSITORY/zipball/$TARGET_SHA" > "$RUNNER_TEMP/payload/source-$RELEASE_VERSION.zip"
    - name: Freeze inventory and checksums
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        EXPECTED_TAG_OBJECT: "${{ needs.tag.outputs.tag-object-sha }}"
        PAYLOAD: "${{ runner.temp }}/payload"
      run: |-
        node <<'JS'
        const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
        const dir=process.env.PAYLOAD;
        const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
        const assets=fs.readdirSync(dir).sort().map(name=>{
          if(!/^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$/.test(name) || !fs.lstatSync(path.join(dir,name)).isFile()) throw new Error('unsafe asset');
          const b=fs.readFileSync(path.join(dir,name));return {name,size:b.length,sha256:hash(b)};
        });
        const bytes=Buffer.from(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,commit:process.env.TARGET_SHA,tag:process.env.TAG,assets},null,2)+'\n');
        fs.writeFileSync(path.join(dir,'ASSET-INVENTORY.json'),bytes);
        fs.writeFileSync(path.join(dir,'SHA256SUMS'),assets.map(a=>a.sha256+'  '+a.name+'\n').join('')+hash(bytes)+'  ASSET-INVENTORY.json\n');
        JS
    - id: artifact
      run: echo "name=source-payload-${{ needs.validate.outputs.tag }}-${{ github.run_id
        }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.artifact.outputs.name }}"
        path: "${{ runner.temp }}/payload"
        if-no-files-found: error
        retention-days: 30
      id: payload-upload
  verify:
    needs:
    - validate
    - assemble
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/payload"
        artifact-ids: "${{ needs.assemble.outputs.artifact-id }}"
        merge-multiple: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Independently verify frozen bytes
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        PAYLOAD: "${{ runner.temp }}/payload"
      run: |
        node <<'JS'
        const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto'), assert=require('node:assert/strict');
        const dir=process.env.PAYLOAD;
        const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
        const inventoryBytes=fs.readFileSync(path.join(dir,'ASSET-INVENTORY.json'));
        const inv=JSON.parse(inventoryBytes);
        assert.equal(inv.repository,process.env.GITHUB_REPOSITORY); assert.equal(inv.commit,process.env.TARGET_SHA); assert.equal(inv.tag,process.env.TAG);
        assert.deepEqual(fs.readdirSync(dir).sort(),[...inv.assets.map(a=>a.name),'ASSET-INVENTORY.json','SHA256SUMS'].sort());
        assert.equal(new Set(inv.assets.map(a=>a.name.toLowerCase())).size,inv.assets.length);
        for (const a of inv.assets) {
          assert.match(a.name,/^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$/);
          const p=path.join(dir,a.name); assert.ok(fs.lstatSync(p).isFile());
          const b=fs.readFileSync(p); assert.equal(b.length,a.size); assert.equal(hash(b),a.sha256);
        }
        const sums=fs.readFileSync(path.join(dir,'SHA256SUMS'),'utf8');
        assert.equal(sums,inv.assets.map(a=>a.sha256+'  '+a.name+'\n').join('')+hash(inventoryBytes)+'  ASSET-INVENTORY.json\n');
        JS
    - name: Attest exact payload
      env:
        PAYLOAD_ARTIFACT: "${{ needs.assemble.outputs.artifact-name }}"
      run: |-
        mkdir "$RUNNER_TEMP/attestation"
        cp "$RUNNER_TEMP/payload/ASSET-INVENTORY.json" "$RUNNER_TEMP/payload/SHA256SUMS" "$RUNNER_TEMP/attestation/"
        printf '%s\n' "$PAYLOAD_ARTIFACT" > "$RUNNER_TEMP/attestation/payload-artifact"
        printf 'verified\n' > "$RUNNER_TEMP/attestation/verdict"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: verified-ubuntu-latest-${{ needs.assemble.outputs.artifact-name }}
        path: "${{ runner.temp }}/attestation"
        if-no-files-found: error
        retention-days: 30
      id: attestation-upload
    outputs:
      artifact-id: "${{ steps.attestation-upload.outputs.artifact-id }}"
      artifact-digest: "${{ steps.attestation-upload.outputs.artifact-digest }}"
  publish:
    if: "${{ !cancelled() && !inputs.dry_run && needs.verify.result == 'success' &&
      needs.verify-arm.result == 'success' }}"
    needs:
    - validate
    - tag
    - assemble
    - verify
    - verify-arm
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release-url: "${{ steps.release.outputs.release-url }}"
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/payload"
        artifact-ids: "${{ needs.assemble.outputs.artifact-id }}"
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/verified-ubuntu-latest"
        artifact-ids: "${{ needs.verify.outputs.artifact-id }}"
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/verified-ubuntu-24.04-arm"
        artifact-ids: "${{ needs.verify-arm.outputs.artifact-id }}"
        merge-multiple: true
    - name: Bind both independent attestations
      env:
        PAYLOAD_ARTIFACT: "${{ needs.assemble.outputs.artifact-name }}"
      run: |-
        set -euo pipefail
        for os in ubuntu-latest ubuntu-24.04-arm; do
          proof="$RUNNER_TEMP/verified-$os"
          [[ "$(cat "$proof/verdict")" == verified ]]
          [[ "$(cat "$proof/payload-artifact")" == "$PAYLOAD_ARTIFACT" ]]
          cmp "$proof/ASSET-INVENTORY.json" "$RUNNER_TEMP/payload/ASSET-INVENTORY.json"
          cmp "$proof/SHA256SUMS" "$RUNNER_TEMP/payload/SHA256SUMS"
        done
        cd "$RUNNER_TEMP/payload"
        sha256sum --strict -c SHA256SUMS
    - name: Publish only attested GitHub release bytes
      id: release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        RELEASE_NAME: "${{ inputs.release-name }}"
        EXPECTED_TAG_OBJECT: "${{ needs.tag.outputs.tag-object-sha }}"
        PAYLOAD: "${{ runner.temp }}/payload"
      with:
        script: |
          const ref = await github.rest.git.getRef({...context.repo, ref: 'tags/' + process.env.TAG});
          if (ref.data.object.type !== 'tag' || ref.data.object.sha !== process.env.EXPECTED_TAG_OBJECT) throw new Error('frozen tag object changed');
          const tag = await github.rest.git.getTag({...context.repo, tag_sha: ref.data.object.sha});
          if (tag.data.object.type !== 'commit' || tag.data.object.sha !== process.env.TARGET_SHA) throw new Error('frozen tag target changed');
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const dir=process.env.PAYLOAD;
          const names=fs.readdirSync(dir).sort();
          const notes=fs.readFileSync(path.join(dir,'RELEASE-NOTES.md'),'utf8');
          const tagName=process.env.TAG;
          const releaseName=process.env.RELEASE_NAME ? process.env.RELEASE_NAME+' '+process.env.RELEASE_VERSION : tagName;
          let release;
          try {release=(await github.rest.repos.getReleaseByTag({...context.repo,tag:tagName})).data;}catch(e){if(e.status!==404)throw e;}
          const compare=async release=>{
            const assets=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:release.id,per_page:100});
            assert.deepEqual(assets.map(a=>a.name).sort(),names,'release asset set differs from verified payload');
            for(const a of assets){
              const r=await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}',{...context.repo,asset_id:a.id,headers:{accept:'application/octet-stream'}});
              assert.deepEqual(Buffer.from(r.data),fs.readFileSync(path.join(dir,a.name)),'release bytes differ: '+a.name);
            }
          };
          if(release&&!release.draft){
            assert.equal(release.tag_name,tagName);assert.equal(release.body,notes);await compare(release);
            core.info('Existing public release matches exact verified bytes; no mutation.');
          }else{
            if(!release){release=(await github.rest.repos.createRelease({...context.repo,tag_name:tagName,target_commitish:process.env.TARGET_SHA,name:releaseName,body:notes,draft:true,prerelease:tagName.includes('-')})).data;}
            assert.equal(release.tag_name,tagName);
            const existing=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:release.id,per_page:100});
            assert.ok(existing.every(a=>names.includes(a.name)),'unexpected existing draft asset');
            for(const name of names){
              const a=existing.find(a=>a.name===name);
              const data=fs.readFileSync(path.join(dir,name));
              if(a){
                const r=await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}',{...context.repo,asset_id:a.id,headers:{accept:'application/octet-stream'}});
                assert.deepEqual(Buffer.from(r.data),data,'existing draft differs; refusing overwrite');
              }else{
                await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
              }
            }
            await compare(release);
            // Recheck after uploads too: a changed tag cannot be published by racing the initial check.
            const finalRef=await github.rest.git.getRef({...context.repo,ref:'tags/'+tagName});
            assert.equal(finalRef.data.object.type,'tag');assert.equal(finalRef.data.object.sha,process.env.EXPECTED_TAG_OBJECT);
            const current=(await github.rest.repos.getRelease({...context.repo,release_id:release.id})).data;
            assert.equal(current.tag_name,tagName);assert.equal(current.draft,true);
            release=(await github.rest.repos.updateRelease({...context.repo,release_id:release.id,body:notes,draft:false})).data;
          }
          assert.equal(release.draft,false);
          core.setOutput('release-url',release.html_url);
  go-proxy:
    if: "!inputs.dry_run && inputs.go-modules != '[]'"
    needs:
    - validate
    - tag
    - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ needs.validate.outputs.target-sha }}"
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: stable
        cache: false
    - name: Warm and verify public Go module proxy
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        EXPECTED_TAG_OBJECT: "${{ needs.tag.outputs.tag-object-sha }}"
        GO_MODULES: "${{ inputs.go-modules }}"
        GOPROXY: https://proxy.golang.org
        GOSUMDB: sum.golang.org
        GOPRIVATE: ''
        GONOPROXY: ''
        GONOSUMDB: ''
        GOTOOLCHAIN: local
      run: |
        set -euo pipefail
        unset GH_TOKEN GITHUB_TOKEN
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess, tempfile, time
        root=pathlib.Path.cwd().resolve()
        dirs=json.loads(os.environ['GO_MODULES'])
        if not isinstance(dirs,list) or not all(isinstance(d,str) for d in dirs): raise SystemExit('go-modules must be a JSON string array')
        for d in dirs:
            p=root/d
            if (d!='.' and not re.fullmatch(r'[A-Za-z0-9_-][A-Za-z0-9._/-]*',d)) or '..' in pathlib.PurePosixPath(d).parts or p.resolve()!=p: raise SystemExit('unsafe Go module directory')
            module=json.loads(subprocess.check_output(['go','mod','edit','-json'],cwd=p))['Module']['Path']
            # Submodules use their directory prefix in the Git tag.
            tag=('' if d=='.' else d.rstrip('/')+'/')+os.environ['TAG']
            if d!='.':
                remote=subprocess.check_output(['git','ls-remote','origin','refs/tags/'+tag+'^{}'],text=True).split()
                if not remote or remote[0]!=os.environ['TARGET_SHA']: raise SystemExit('Go submodule needs its own annotated directory/version tag at frozen commit')
            env=dict(os.environ,GOMODCACHE=tempfile.mkdtemp(),GOWORK='off')
            deadline=time.monotonic()+600
            while True:
                r=subprocess.run(['go','mod','download','-json',module+'@'+os.environ['TAG']],cwd=tempfile.gettempdir(),env=env,capture_output=True,text=True)
                if r.returncode==0:
                    result=json.loads(r.stdout)
                    if result.get('Version')!=os.environ['TAG'] or not result.get('Sum') or result.get('Origin',{}).get('Hash')!=os.environ['TARGET_SHA']: raise SystemExit('proxy module does not match version/commit/checksum')
                    print(module+' verified through proxy.golang.org and sum.golang.org'); break
                if time.monotonic()>=deadline: raise SystemExit('Go proxy visibility deadline exceeded')
                time.sleep(10)
        PY
  handoff:
    if: "!inputs.dry_run && inputs.homebrew-formula != ''"
    needs:
    - validate
    - assemble
    - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/payload"
        artifact-ids: "${{ needs.assemble.outputs.artifact-id }}"
        merge-multiple: true
    - name: Hand verified release to configured tap
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        PAYLOAD: "${{ runner.temp }}/payload"
        TAP: "${{ inputs.homebrew-tap }}"
        FORMULA: "${{ inputs.homebrew-formula }}"
      with:
        github-token: "${{ secrets.TAP_TOKEN }}"
        script: |
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const dir=process.env.PAYLOAD;
          const inv=JSON.parse(fs.readFileSync(path.join(dir,'ASSET-INVENTORY.json')));
          let name;
          if(fs.existsSync(path.join(dir,'PACKAGE-PLAN.json'))){
            const plan=JSON.parse(fs.readFileSync(path.join(dir,'PACKAGE-PLAN.json')));
            name=plan[plan.length-1].file;
          }else{name='source-'+process.env.TAG.slice(1)+'.tar.gz';}
          const asset=inv.assets.find(a=>a.name===name);assert.ok(asset,'Homebrew requires a verified tarball; enable source-archives');
          const url=`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${name}`;
          const [owner,repo]=process.env.TAP.split('/'),workflow='update-formula.yml';
          const target=(await github.rest.repos.get({owner,repo})).data;
          await github.rest.actions.getWorkflow({owner,repo,workflow_id:workflow});
          const requestId=`release-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:workflow,ref:target.default_branch,inputs:{formula:process.env.FORMULA,tag:process.env.TAG,repository:process.env.GITHUB_REPOSITORY,artifact_url:url,request_id:requestId}});
          const deadline=Date.now()+15*60*1000;
          while(Date.now()<deadline){
            const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:workflow,event:'workflow_dispatch',per_page:100})).data.workflow_runs;
            const matches=runs.filter(r=>r.display_title.endsWith('('+requestId+')'));
            assert.ok(matches.length<=1,'ambiguous tap handoff');
            if(matches[0]?.status==='completed'){
              assert.equal(matches[0].conclusion,'success','tap workflow failed');
              const file=(await github.rest.repos.getContent({owner,repo,path:'Formula/'+process.env.FORMULA+'.rb',ref:target.default_branch})).data;
              const text=Buffer.from(file.content,'base64').toString();
              // source-formula-parser-begin
              const parser=String.raw`
          require 'ripper'
          require 'json'
          def reject(message); abort(message); end
          def literal(node)
            reject('non-literal formula argument') unless node.is_a?(Array)
            case node[0]
            when :string_literal
              content=node[1]
              reject('interpolated formula string') unless content[0]==:string_content && content[1..].all? { |t| t[0]==:@tstring_content && !t[1].match?(/[\\\r\n]/) }
              content[1..].map { |t| t[1] }.join
            when :symbol_literal
              reject('dynamic symbol') unless node[1][0]==:symbol && [:@ident,:@op,:@kw].include?(node[1][1][0])
              node[1][1][1]
            when :@int
              node[1]
            when :hash, :bare_assoc_hash
              list=node[0]==:hash ? node.dig(1,1) : node[1]
              Array(list).each do |item|
                reject('dynamic hash') unless item[0]==:assoc_new
                literal(item[1]); literal(item[2])
              end
              nil
            else
              reject('unsupported literal')
            end
          end
          program=Ripper.sexp(STDIN.read)
          reject('invalid formula') unless program && program[0]==:program
          roots=program[1].reject { |n| n[0]==:void_stmt }
          reject('expected one formula class') unless roots.length==1 && roots[0][0]==:class
          klass=roots[0]
          reject('expected Formula superclass') unless klass[2]==[:var_ref, [:@const, 'Formula', klass[2].dig(1,2)]]
          body=klass[3]
          reject('class rescue/ensure forbidden') unless body[0]==:bodystmt && body[2..].all?(&:nil?)
          values={}
          body[1].each do |node|
            next if node[0]==:void_stmt
            if node[0]==:def
              reject('unsupported method override') unless %w[install post_install caveats].include?(node[1][1])
              next
            end
            if node[0]==:method_add_block
              call=node[1]
              reject('only test block allowed') unless call[0]==:method_add_arg && call[1][0]==:fcall && call[1][1][1]=='test' && call[2]==[]
              next
            end
            reject('dynamic class body') unless node[0]==:command
            method=node[1][1]
            reject('unsupported formula setter') unless %w[desc homepage url sha256 license version revision head depends_on uses_from_macos keg_only conflicts_with skip_clean].include?(method)
            args=node[2]
            reject('block/splat argument') unless args[0]==:args_add_block && args[2]==false && args[1].is_a?(Array)
            parsed=args[1].map { |arg| literal(arg) }
            if %w[url sha256].include?(method)
              reject('duplicate fetch setter') if values.key?(method)
              reject('fetch setter must have one literal string') unless parsed.length==1 && args[1][0][0]==:string_literal
              values[method]=parsed[0]
            end
          end
          reject('missing stable fetch') unless values.keys.sort==%w[sha256 url]
          puts JSON.generate(values)
          `;
              // source-formula-parser-end
              const fetched=JSON.parse(require('node:child_process').execFileSync('ruby',['-e',parser],{input:text,encoding:'utf8'}));
              assert.equal(fetched.url,url);assert.equal(fetched.sha256,asset.sha256);
              core.info('Tap run and literal formula URL/SHA-256 verified: '+matches[0].html_url);return;
            }
            await new Promise(r=>setTimeout(r,15000));
          }
          throw new Error('tap handoff deadline exceeded');
  verify-arm:
    needs:
    - validate
    - assemble
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: "${{ runner.temp }}/payload"
        artifact-ids: "${{ needs.assemble.outputs.artifact-id }}"
        merge-multiple: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Independently verify frozen bytes
      env:
        TAG: "${{ needs.validate.outputs.tag }}"
        TARGET_SHA: "${{ needs.validate.outputs.target-sha }}"
        RELEASE_VERSION: "${{ needs.validate.outputs.release-version }}"
        PAYLOAD: "${{ runner.temp }}/payload"
      run: |
        node <<'JS'
        const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto'), assert=require('node:assert/strict');
        const dir=process.env.PAYLOAD;
        const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
        const inventoryBytes=fs.readFileSync(path.join(dir,'ASSET-INVENTORY.json'));
        const inv=JSON.parse(inventoryBytes);
        assert.equal(inv.repository,process.env.GITHUB_REPOSITORY); assert.equal(inv.commit,process.env.TARGET_SHA); assert.equal(inv.tag,process.env.TAG);
        assert.deepEqual(fs.readdirSync(dir).sort(),[...inv.assets.map(a=>a.name),'ASSET-INVENTORY.json','SHA256SUMS'].sort());
        assert.equal(new Set(inv.assets.map(a=>a.name.toLowerCase())).size,inv.assets.length);
        for (const a of inv.assets) {
          assert.match(a.name,/^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$/);
          const p=path.join(dir,a.name); assert.ok(fs.lstatSync(p).isFile());
          const b=fs.readFileSync(p); assert.equal(b.length,a.size); assert.equal(hash(b),a.sha256);
        }
        const sums=fs.readFileSync(path.join(dir,'SHA256SUMS'),'utf8');
        assert.equal(sums,inv.assets.map(a=>a.sha256+'  '+a.name+'\n').join('')+hash(inventoryBytes)+'  ASSET-INVENTORY.json\n');
        JS
    - name: Attest exact payload
      env:
        PAYLOAD_ARTIFACT: "${{ needs.assemble.outputs.artifact-name }}"
      run: |-
        mkdir "$RUNNER_TEMP/attestation"
        cp "$RUNNER_TEMP/payload/ASSET-INVENTORY.json" "$RUNNER_TEMP/payload/SHA256SUMS" "$RUNNER_TEMP/attestation/"
        printf '%s\n' "$PAYLOAD_ARTIFACT" > "$RUNNER_TEMP/attestation/payload-artifact"
        printf 'verified\n' > "$RUNNER_TEMP/attestation/verdict"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: verified-ubuntu-24.04-arm-${{ needs.assemble.outputs.artifact-name }}
        path: "${{ runner.temp }}/attestation"
        if-no-files-found: error
        retention-days: 30
      id: attestation-upload
    outputs:
      artifact-id: "${{ steps.attestation-upload.outputs.artifact-id }}"
      artifact-digest: "${{ steps.attestation-upload.outputs.artifact-digest }}"
