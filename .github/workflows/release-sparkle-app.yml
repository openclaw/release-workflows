          # BEGIN inventory.py
          import hashlib,json,os,re,stat
          from pathlib import Path

          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def files(root):
              entries=sorted(Path(root).iterdir())
              if any(not p.is_file() or p.is_symlink() for p in entries): raise ValueError('asset must be a regular file')
              names=[p.name for p in entries]
              if len({n.casefold() for n in names})!=len(names): raise ValueError('asset case collision')
              if any(not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,254}',n) or n.endswith('.') for n in names): raise ValueError('unsafe asset name')
              return entries

          def freeze(root,checksum,repository,tag,commit):
              root=Path(root); entries=files(root)
              if any(p.name.casefold() in (checksum.casefold(),'asset-inventory.json') for p in entries): raise ValueError('reserved asset collision')
              payloads=[dict(name=p.name,size=p.stat().st_size,sha256=digest(p)) for p in entries]
              (root/'ASSET-INVENTORY.json').write_text(json.dumps(dict(schemaVersion=1,repository=repository,tag=tag,commit=commit,payloads=payloads),indent=2)+'\n')
              (root/checksum).write_text(''.join(f'{digest(p)}  {p.name}\n' for p in files(root)))
              verify(root,checksum,repository,tag,commit)

          def verify(root,checksum,repository,tag,commit):
              root=Path(root); entries=files(root)
              lines=(root/checksum).read_text().splitlines(); hashes={}
              for line in lines:
                  m=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]{0,254})',line)
                  if not m or m[2] in hashes: raise ValueError('invalid or duplicate checksum line')
                  hashes[m[2]]=m[1]
              if set(hashes)!={p.name for p in entries if p.name!=checksum}: raise ValueError('checksum inventory mismatch')
              if any(digest(root/n)!=h for n,h in hashes.items()): raise ValueError('asset digest mismatch')
              inv=json.loads((root/'ASSET-INVENTORY.json').read_bytes().decode('utf-8'))
              for k,v in dict(schemaVersion=1,repository=repository,tag=tag,commit=commit).items():
                  if inv.get(k)!=v: raise ValueError('inventory identity mismatch')
              names=[p['name'] for p in inv['payloads']]
              if len(names)!=len(set(names)) or set(names)!=(set(hashes)-{'ASSET-INVENTORY.json'}): raise ValueError('inventory payload mismatch')
              for p in inv['payloads']:
                  if p['sha256']!=hashes[p['name']] or p['size']!=(root/p['name']).stat().st_size: raise ValueError('inventory digest/size mismatch')

          def bind_signed(original,final,checksum=None,npm_enabled=False):
              original=Path(original); final=Path(final)
              expected={p.name for p in files(original)}
              observed={p.name for p in files(final)}
              if checksum is not None:
                  expected.update({'RELEASE-NOTES.md','appcast.xml','appcast-entry.json','ASSET-INVENTORY.json',checksum})
                  npm={name for name in observed if name.endswith('.tgz')}
                  if len(npm)!=(1 if npm_enabled else 0): raise ValueError('unexpected npm asset set')
                  expected.update(npm)
              if observed!=expected: raise ValueError('unexpected final asset set')
              for path in files(original):
                  if (final/path.name).read_bytes()!=path.read_bytes(): raise ValueError('final payload differs from immutable signer artifact: '+path.name)

          def tree(root):
              from contract import tree as safe_tree
              safe_tree(root)
              root=Path(root); result=[]
              for parent,dirs,files in os.walk(root,followlinks=False):
                  for name in dirs+files:
                      p=Path(parent)/name; mode=p.lstat().st_mode
                      result.append((p.relative_to(root).as_posix(),stat.S_IMODE(mode), 'link' if p.is_symlink() else 'dir' if p.is_dir() else 'file',os.readlink(p) if p.is_symlink() else digest(p) if p.is_file() else ''))
              return sorted(result)

          def equal_trees(left,right):
              if tree(left)!=tree(right): raise ValueError('DMG embedded app tree differs from ZIP')
          # END inventory.py
