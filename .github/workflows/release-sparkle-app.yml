          require(set(p.name for p in root.iterdir())==set(manifest['digests'])|{'SIGNING-MANIFEST.json'},'signed inventory mismatch')
          for name,digest in manifest['digests'].items(): require(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,'signed bytes changed')
          if e['NPM_PACK_SCRIPT']:
              packs=list(Path('source/dist/sparkle-npm').glob('*.tgz'))
              require(len(packs)==1 and packs[0].is_file() and not packs[0].is_symlink(),'npm script must emit exactly one regular .tgz')
