          def check(app):
              e=os.environ; app=Path(app); tree(app)
              info=app/'Contents/Info.plist'
              require(info.is_file() and not info.is_symlink(),'missing regular Info.plist')
              data=plistlib.loads(info.read_bytes())
              require(data.get('SURequireSignedFeed',False) is False,'SURequireSignedFeed is unsupported: this workflow publishes an unsigned appcast; disable signed-feed requirements before releasing')
              for key,expected in [('CFBundleShortVersionString',e['VERSION']),('CFBundleIdentifier',e['BUNDLE_IDENTIFIER']),('LSMinimumSystemVersion',e['MINIMUM_SYSTEM_VERSION']),('SUFeedURL',e['APPCAST_FEED_URL']),('SUPublicEDKey',e['SPARKLE_PUBLIC_KEY'])]:
                  require(data.get(key)==expected,'Info.plist mismatch: '+key)
