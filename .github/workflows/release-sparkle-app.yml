          // BEGIN sparkle.cjs
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const publicKey = (text) => {
            const bytes = Buffer.from(text, 'base64');
            if (bytes.length !== 32 || bytes.toString('base64') !== text) throw new Error('invalid Sparkle public key');
            return crypto.createPublicKey({key: Buffer.concat([Buffer.from('302a300506032b6570032100','hex'), bytes]), format:'der', type:'spki'});
          };
          function checkPrivate(seedText, expected) {
            const seed = Buffer.from(seedText.trim(),'base64');
            if (seed.length !== 32 || seed.toString('base64') !== seedText.trim()) throw new Error('Sparkle private key must be a base64 32-byte seed exported by generate_keys');
            const key = crypto.createPrivateKey({key: Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),seed]),format:'der',type:'pkcs8'});
            const derived = crypto.createPublicKey(key).export({format:'der',type:'spki'});
            if (!derived.equals(publicKey(expected).export({format:'der',type:'spki'}))) throw new Error('Sparkle private/public key mismatch');
          }
          function verify(file, signature, expected) {
            const sig=Buffer.from(signature,'base64');
            if (sig.length !== 64 || sig.toString('base64') !== signature || !crypto.verify(null,fs.readFileSync(file),publicKey(expected),sig)) throw new Error('Sparkle signature mismatch');
          }
          module.exports={checkPrivate,verify};
          if (require.main===module) {
            if(process.argv[2]==='private') checkPrivate(fs.readFileSync(process.argv[3],'utf8'),process.env.SPARKLE_PUBLIC_KEY);
            else verify(process.argv[3],process.argv[4],process.env.SPARKLE_PUBLIC_KEY);
          }
          // END sparkle.cjs
