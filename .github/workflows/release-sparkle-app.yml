          # BEGIN notary.py
          import json,os,re,subprocess,time
          from pathlib import Path

          def submit(path, invoke, schedule=time.sleep):
              for attempt in range(3):
                  code,out,err=invoke(path)
                  try: response=json.loads(out)
                  except ValueError: response={}
                  submission=response.get('id')
                  state=response.get('status')
                  if submission: print('notarization submission: '+str(submission),flush=True)
                  if code==0 and state=='Accepted' and submission: return response
                  # Any assigned ID is a submission: never risk a second upload on uncertain completion.
                  if submission or state or re.search(r'\b[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}\b|\b(?:Accepted|Invalid|In Progress)\b',out+'\n'+err): raise RuntimeError('notarization failed or needs investigation; no resubmit: '+str(state))
                  transient=bool(re.search(r'abortedUpload|NSURLErrorDomain|network connection.*lost|timed? out|connection reset|Could not resolve host|Failed to connect',out+'\n'+err,re.I))
                  if not transient or attempt==2: raise RuntimeError('notarization upload failed before acceptance')
                  schedule(15*(2**attempt))
              raise RuntimeError('unreachable retry state')

          def ticket(path,invoke,schedule=time.sleep):
              for attempt in range(6):
                  if invoke(path)==0: return
                  if attempt==5: raise RuntimeError('online notarization ticket unavailable')
                  schedule(10*(2**attempt))

          if __name__=='__main__':
              import sys
              if sys.argv[1]=='submit':
                  def invoke(path):
                      p=subprocess.run(['xcrun','notarytool','submit',path,'--key',os.environ['NOTARY_KEY'],'--key-id',os.environ['ASC_KEY_ID'],'--issuer',os.environ['ASC_ISSUER_ID'],'--no-s3-acceleration','--wait','--output-format','json'],capture_output=True,text=True)
                      return p.returncode,p.stdout,p.stderr
                  result=submit(sys.argv[2],invoke)
                  Path(sys.argv[3]).write_text(json.dumps(result)+'\n')
              else:
                  ticket(sys.argv[2],lambda path:subprocess.run(['codesign','--verify','--strict','--check-notarization','-R=notarized',path]).returncode)
          # END notary.py
