          rm -rf signed-assets
          tar -xzf signed-sparkle.tar.gz
          python3 - <<'PYCODE'
          import os,sys,json,hashlib,tarfile,email.utils,shutil
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from contract import require
          from inventory import freeze
          from appcast import update
          root=Path('signed-assets'); e=os.environ
          manifest=json.loads((root/'SIGNING-MANIFEST.json').read_text())
