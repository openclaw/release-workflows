          # BEGIN unpack.py
          import os,stat,tarfile,zipfile,unicodedata,subprocess,sys
          from pathlib import Path,PurePosixPath

          def unpack(archive,destination,root,kind):
              entries={}; links={}
              def canonical(name): return unicodedata.normalize('NFD',name).casefold()
              source=zipfile.ZipFile(archive) if kind=='zip' else tarfile.open(archive)
              for item in source.infolist() if kind=='zip' else source.getmembers():
                  raw=item.filename if kind=='zip' else item.name
                  name=raw.rstrip('/')
                  parts=name.split('/')
                  if any(p in ('','.','..') for p in parts) or '\\' in name or any(ord(c)<32 for c in name): raise ValueError('unsafe archive path')
                  if parts[0]!=root and not (kind=='zip' and parts[0]=='__MACOSX'): raise ValueError('unexpected archive root')
                  key=canonical(name)
                  if key in entries: raise ValueError('duplicate archive path')
                  entries[key]=item
                  if kind=='zip':
                      mode=item.external_attr>>16
                      if stat.S_IFMT(mode) not in (0,stat.S_IFREG,stat.S_IFDIR,stat.S_IFLNK): raise ValueError('unsupported archive entry')
                      islink=stat.S_ISLNK(mode)
                      target=source.read(item).decode() if islink else ''
                  else:
                      if not (item.isfile() or item.isdir() or item.issym()): raise ValueError('unsupported tar entry')
                      islink=item.issym(); target=item.linkname
                  if islink:
                      if not target or target.startswith('/') or '\\' in target: raise ValueError('unsafe symlink')
                      links[key]=canonical(target)
              for name in entries:
                  if any(str(p) in links for p in PurePosixPath(name).parents): raise ValueError('entry beneath symlink')
              def resolve(parts,seen=()):
                  result=[]
                  for part in parts:
                      if part in ('','.'): continue
                      if part=='..':
                          if len(result)<=1: raise ValueError('symlink escape')
                          result.pop(); continue
                      result.append(part); key='/'.join(result)
                      if key in links:
                          if key in seen: raise ValueError('cyclic symlink')
                          result=resolve(result[:-1]+links[key].split('/'),seen+(key,))
                  return result
              for name in links:
                  result=resolve(name.split('/'))
                  if not result or result[0]!=canonical(root): raise ValueError('symlink escapes root')
              Path(destination).mkdir(parents=True,exist_ok=False)
              subprocess.run(['ditto','-x','-k',archive,destination] if kind=='zip' else ['tar','-xzf',archive,'-C',destination],check=True)
              from contract import tree
              tree(Path(destination)/root)
          if __name__=='__main__': unpack(*sys.argv[1:])
          # END unpack.py
