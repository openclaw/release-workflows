    name: 7 · Independent Sparkle verify (${{ matrix.runner }})
    needs:
      - validate
      - sign
      - package
      - draft
    if: ${{ always() && needs.validate.result == 'success' && needs.package.result == 'success' && (inputs.dry-run || needs.draft.result == 'success') }}
