          # BEGIN runtime_libraries.py
          import re,subprocess
          from pathlib import Path

          def read(*args):return subprocess.check_output(args,text=True)
          def commands(path,arch):
              return re.split(r'(?m)^\s*cmd ',read('otool','-arch',arch,'-l',str(path)))[1:]
          def rpaths(blocks):
              return [re.search(r'(?m)^\s*path (.+?) \(offset ',b).group(1) for b in blocks if b.splitlines()[0].strip()=='LC_RPATH']
          def check_companions(root,binary):
              root=Path(root).resolve();executable=root/binary
              for arch in ('arm64','x86_64'):
                  inherited=rpaths(commands(executable,arch))
                  for p in root.iterdir():
                      if p.name!=binary and p.suffix!='.dylib':continue
                      blocks=commands(p,arch)
                      search=list(dict.fromkeys(rpaths(blocks)+inherited))
                      for block in blocks:
                          # LC_ID_DYLIB names the current library, not a dependency.
                          if block.splitlines()[0].strip() not in ('LC_LOAD_DYLIB','LC_LOAD_WEAK_DYLIB','LC_REEXPORT_DYLIB','LC_LOAD_UPWARD_DYLIB'):continue
                          dependency=re.search(r'(?m)^\s*name (.+?) \(offset ',block).group(1)
                          if not dependency.startswith('@rpath/'):continue
                          candidates=[]
                          for base in search:
                              expanded=base.replace('@loader_path',str(p.parent)).replace('@executable_path',str(root))
                              if '@' in expanded:continue
                              target=(Path(expanded)/dependency.removeprefix('@rpath/')).resolve()
                              if target.is_relative_to(root) and target.is_file():candidates.append(target)
                          if not candidates:raise ValueError('dangling @rpath companion: '+dependency)
                          if not any(arch in read('lipo','-archs',str(p)).split() for p in candidates):raise ValueError('missing companion architecture')
          # END runtime_libraries.py
