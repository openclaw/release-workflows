                .filter((check) => check.status !== 'completed' || !accepted.has(check.conclusion))
                .map((check) => `${check.name}=${check.status}/${check.conclusion}`),
              ...[...latestStatuses.values()]
                .filter((status) => status.state !== 'success')
                .map((status) => `${status.context}=status/${status.state}`),
            ];
            if (failures.length) core.setFailed(`non-green checks: ${failures.join(', ')}`);
