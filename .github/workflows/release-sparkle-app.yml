          # BEGIN signing.py
          import os,plistlib,subprocess
          from pathlib import Path
          from contract import require,tree,check_deployment

          def signing_paths(app):
              app=Path(app).resolve();tree(app)
              framework=app/'Contents/Frameworks/Sparkle.framework'
              require(framework.is_dir() and not framework.is_symlink(),'missing physical Sparkle.framework')
              require(len([p for p in app.rglob('Sparkle.framework') if not p.is_symlink()])==1,'multiple Sparkle frameworks')
              current=framework/'Versions/Current'
              require(current.is_symlink(),'missing Sparkle Current alias')
              version=current.resolve(strict=True)
              require(version.parent==framework/'Versions','Sparkle version escapes framework')
              bundles=[version/'XPCServices/Downloader.xpc',version/'XPCServices/Installer.xpc',version/'Updater.app']
              for bundle in bundles:
                  require(bundle.is_dir() and not bundle.is_symlink(),'missing physical Sparkle helper')
                  data=plistlib.loads((bundle/'Contents/Info.plist').read_bytes())
                  name=data.get('CFBundleExecutable','')
                  require(bool(name) and '/' not in name and name not in ('.','..'),'invalid Sparkle executable')
                  require((bundle/'Contents/MacOS'/name).is_file(),'missing Sparkle executable')
              for name,target in [('Autoupdate',version/'Autoupdate'),('Updater.app',version/'Updater.app'),('XPCServices',version/'XPCServices'),('Sparkle',version/'Sparkle')]:
                  link=framework/name
                  require(link.is_symlink() and link.resolve(strict=True)==target,'invalid Sparkle topology alias')
              require((version/'Autoupdate').is_file() and (version/'Sparkle').is_file(),'missing Sparkle tools')
              targets=[]
              for parent,dirs,files in os.walk(app,followlinks=False):
                  for name in dirs+files:
                      item=Path(parent)/name
                      if item.is_symlink():continue
                      if item.is_dir() and item.suffix in ('.xpc','.app','.framework','.appex','.bundle'):targets.append(item)
                      elif item.is_file():
                          description=subprocess.check_output(['file','-b',str(item)],text=True)
                          if 'Mach-O' in description:
                              check_deployment(item,os.environ['MINIMUM_SYSTEM_VERSION'])
                              targets.append(item)
                          elif os.access(item,os.X_OK):require(False,'non-Mach-O executable in app')
              return sorted(targets,key=lambda path:(-len(path.parts),str(path)))
          if __name__=='__main__':
              import sys
              for item in signing_paths(sys.argv[1]):sys.stdout.buffer.write(os.fsencode(item)+b'\0')
          # END signing.py
