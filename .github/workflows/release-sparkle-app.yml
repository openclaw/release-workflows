  tag:
    name: 5 · Freeze annotated tag after approved signing
    needs:
      - validate
      - sign
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse immutable annotated tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object-sha }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
        with:
          script: |
            let existing = null;
            try {
              existing = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (process.env.EXPECTED_TAG_OBJECT !== '') {
              if (existing === null) throw new Error('release tag disappeared after validation');
              if (
                existing.data.object.type !== 'tag' ||
                existing.data.object.sha !== process.env.EXPECTED_TAG_OBJECT
              ) {
                throw new Error('release tag object changed after validation');
              }
              const object = await github.rest.git.getTag({
                ...context.repo,
                tag_sha: process.env.EXPECTED_TAG_OBJECT,
              });
              if (object.data.object.type !== 'commit' || object.data.object.sha !== process.env.TARGET_SHA)
                throw new Error('existing release tag target changed');
              return;
            }
            if (existing !== null) throw new Error('release tag appeared after validation');
            const object = await github.rest.git.createTag({
              ...context.repo,
              tag: process.env.TAG,
              message: `Release ${process.env.TAG}\n\nFleet Sparkle app release tag.`,
              object: process.env.TARGET_SHA,
              type: 'commit',
              tagger: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com',
                date: new Date().toISOString(),
              },
            });
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${process.env.TAG}`,
              sha: object.data.sha,
            });
    if: ${{ !inputs.dry-run }}
  draft:
    name: 6 · Create exact Sparkle draft
    needs:
      - validate
      - tag
      - package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      verification-artifact-name: ${{ needs.package.outputs.artifact-name }}
    steps:
      - name: Download immutable signed payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
      - name: Prepare safe release transport reader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          cat >"$RUNNER_TEMP/sparkle-tools/payload.py" <<'SOURCE'
          # BEGIN payload.py
          import re,shutil,tarfile
          from pathlib import Path

          def unpack_payload(archive,destination):
              destination=Path(destination)
              with tarfile.open(archive) as source:
                  members=source.getmembers(); seen=set()
                  for member in members:
                      name=member.name.rstrip('/')
                      if name=='release-assets' and member.isdir():continue
                      parts=name.split('/')
                      if len(parts)!=2 or parts[0]!='release-assets' or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,254}',parts[1]) or parts[1].endswith('.') or not member.isfile():
                          raise ValueError('unsafe release transport member')
                      key=name.casefold()
                      if key in seen:raise ValueError('duplicate release transport member')
                      seen.add(key)
                  if not seen:raise ValueError('empty release transport')
                  destination.mkdir(parents=True,exist_ok=False)
                  root=destination/'release-assets';root.mkdir()
                  # Never let tar extract paths, links, devices, or metadata on our behalf.
                  for member in members:
                      if member.isfile():
                          with source.extractfile(member) as src,(root/member.name.split('/')[1]).open('xb') as dst:
                              shutil.copyfileobj(src,dst)
          if __name__=='__main__':
              import sys
              unpack_payload(*sys.argv[1:])
          # END payload.py
          SOURCE
      - name: Create draft and upload exact assets
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sparkle-tools/payload.py" sparkle-release-assets.tar.gz "$RUNNER_TEMP/sparkle-payload"
          cd "$RUNNER_TEMP/sparkle-payload"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | LC_ALL=C sort)
          (( ${#assets[@]} >= 6 ))
          gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null
          payload=$(jq -n --arg tag "$TAG" --rawfile notes release-assets/RELEASE-NOTES.md '{tag_name:$tag, name:$tag, draft:true, prerelease:($tag|contains("-")), body:$notes}')
          created=$(gh api --method POST --input - "repos/${GH_REPO}/releases" <<<"$payload")
          release_id=$(jq -r .id <<<"$created")
          upload_base=$(jq -r .upload_url <<<"$created")
          upload_base=${upload_base%\{*}
          [[ "$release_id" =~ ^[0-9]+$ ]]
          [[ "$upload_base" == "https://uploads.github.com/repos/${GH_REPO}/releases/${release_id}/assets" ]]
          for asset in "${assets[@]}"; do
            name=${asset##*/}
            encoded_name=$(jq -rn --arg name "$name" '$name|@uri')
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "${upload_base}?name=${encoded_name}" \
              --input "$asset" >/dev/null
          done
          echo "release-id=$release_id" >>"$GITHUB_OUTPUT"
    if: ${{ !inputs.dry-run }}
