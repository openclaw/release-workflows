      - name: Verify inventory, Sparkle signature, sealed app, DMG, and CLI
        env:
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle-identifier }}
          MINIMUM_SYSTEM_VERSION: ${{ inputs.minimum-system-version }}
          SPARKLE_PUBLIC_KEY: ${{ inputs.sparkle-public-key }}
          APPCAST_FEED_URL: ${{ inputs.appcast-feed-url }}
          CLI_BINARY_NAME: ${{ inputs.cli-binary-name }}
          CLI_IDENTIFIER: ${{ inputs.cli-identifier }}
          CLI_ARCHIVE_PREFIX: ${{ inputs.cli-archive-prefix }}
          REPOSITORY_TYPE: ${{ inputs.repository-type }}
          VERSION: ${{ needs.validate.outputs.release-version }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
          CHECKSUM_FILENAME: ${{ inputs.checksum-filename }}
          CLI_SMOKE_ARGS: ${{ inputs.cli-smoke-args }}
          SWIFT_RUNTIME_AUDIT: ${{ inputs.swift-runtime-audit }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          VERIFY_RUNNER: ${{ matrix.runner }}
          PAYLOAD_ARTIFACT: ${{ needs.package.outputs.artifact-name }}
          NPM_PACK_SCRIPT: ${{ inputs.npm-pack-script }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sparkle-tools/payload.py" sparkle-release-assets.tar.gz "$RUNNER_TEMP/sparkle-payload"
          cd "$RUNNER_TEMP/sparkle-payload"
          tar -xzf "$GITHUB_WORKSPACE/signer-original/signed-sparkle.tar.gz" -C "$GITHUB_WORKSPACE/signer-original"
          python3 - <<'PYCODE'
          import os,sys,json,hashlib
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from inventory import verify,bind_signed
          from contract import require
          from appcast import validate,update
          root=Path('release-assets'); e=os.environ
          verify(root,e['CHECKSUM_FILENAME'],e['GITHUB_REPOSITORY'],e['TAG'],e['TARGET_SHA'])
          bind_signed(Path(e['GITHUB_WORKSPACE'])/'signer-original/signed-assets',root,e['CHECKSUM_FILENAME'],bool(e['NPM_PACK_SCRIPT']))
          require((root/'RELEASE-NOTES.md').read_bytes()==(Path(e['GITHUB_WORKSPACE'])/'source-original/RELEASE-NOTES.md').read_bytes(),'release notes differ from frozen source')
          manifest=json.loads((root/'SIGNING-MANIFEST.json').read_text())
          for name,digest in manifest['digests'].items(): require(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,'signed manifest digest mismatch')
          entry=json.loads((root/'appcast-entry.json').read_text())
          zipname=e['APP_NAME']+'-'+e['VERSION']+'.app.zip'
          release='https://github.com/'+e['GITHUB_REPOSITORY']+'/releases/tag/'+e['TAG']
          for key,value in dict(title=e['APP_NAME']+' '+e['VERSION'],version=e['VERSION'],buildNumber=manifest['buildNumber'],releaseUrl=release,assetUrl='https://github.com/'+e['GITHUB_REPOSITORY']+'/releases/download/'+e['TAG']+'/'+zipname,zipLength=(root/zipname).stat().st_size,edSignature=manifest['edSignature'],minimumSystemVersion=e['MINIMUM_SYSTEM_VERSION']).items(): require(entry[key]==value,'appcast entry mismatch: '+key)
          validate((root/'appcast.xml').read_text(),entry)
          require((root/'appcast.xml').read_text()==update((Path(e['GITHUB_WORKSPACE'])/'source-original/appcast.xml').read_text(),entry),'appcast differs from frozen source feed')
          if e['NPM_PACK_SCRIPT']:
              from npm import verify_package
              packs=list(root.glob('*.tgz'))
              require(len(packs)==1,'expected exactly one npm package')
              verify_package(root/(e['CLI_ARCHIVE_PREFIX']+'-universal.tar.gz'),packs[0],e['CLI_ARCHIVE_PREFIX'],e['CLI_BINARY_NAME'],os.environ['VERSION'])
          PYCODE
          signature=$(python3 -c 'import json; print(json.load(open("release-assets/appcast-entry.json"))["edSignature"])')
          node "$RUNNER_TEMP/sparkle-tools/sparkle.cjs" verify "release-assets/$APP_NAME-$VERSION.app.zip" "$signature"
          python3 "$RUNNER_TEMP/sparkle-tools/unpack.py" "release-assets/$APP_NAME-$VERSION.app.zip" verified-app "$APP_NAME.app" zip
          app="verified-app/$APP_NAME.app"
          python3 "$RUNNER_TEMP/sparkle-tools/metadata.py" "$app"
          python3 "$RUNNER_TEMP/sparkle-tools/downloader.py" verify-manifest "$app" release-assets/SIGNING-MANIFEST.json
          if [[ "$REPOSITORY_TYPE" == openclaw ]]; then
            team=FWJYW4S8P8
            authority="Developer ID Application: OpenClaw Foundation ($team)"
          else
            team=Y5PE65HELJ
            authority="Developer ID Application: Peter Steinberger ($team)"
          fi
          export TEAM_ID="$team" AUTHORITY="$authority"
          requirement="identifier \"$BUNDLE_IDENTIFIER\" and anchor apple generic and certificate leaf[subject.OU] = \"$team\""
          codesign --verify --strict --deep -R="$requirement" "$app"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          dmg="release-assets/$APP_NAME-$VERSION.dmg"
          codesign --verify --strict -R="anchor apple generic and certificate leaf[subject.OU] = \"$team\"" "$dmg"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          mount="$RUNNER_TEMP/sparkle-dmg"
          mkdir "$mount"
          trap 'hdiutil detach "$mount" -quiet' EXIT
          hdiutil attach "$dmg" -nobrowse -noautoopen -readonly -mountpoint "$mount" -quiet
          [[ -L "$mount/Applications" && "$(readlink "$mount/Applications")" == /Applications ]]
          python3 - "$app" "$mount/$APP_NAME.app" <<'PYCODE'
          import os,sys
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from inventory import equal_trees
          equal_trees(*sys.argv[1:])
          PYCODE
          hdiutil detach "$mount" -quiet
          trap - EXIT
          if [[ -n "$CLI_BINARY_NAME" ]]; then
            for arch in universal arm64 x86_64; do
              python3 "$RUNNER_TEMP/sparkle-tools/unpack.py" "release-assets/$CLI_ARCHIVE_PREFIX-$arch.tar.gz" "verified-$arch" "$CLI_ARCHIVE_PREFIX-$arch" tar
            done
          fi
          python3 - <<'PYCODE'
          import os,sys,subprocess,json,hashlib
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from contract import require
          from runtime import audit
          app=Path('verified-app')/(os.environ['APP_NAME']+'.app')
          paths=[]
          for p in app.rglob('*'):
              if p.is_file() and not p.is_symlink() and 'Mach-O' in subprocess.check_output(['file','-b',str(p)],text=True): paths.append(p)
          if os.environ['CLI_BINARY_NAME']:
              for arch in ('universal','arm64','x86_64'):
                  root=Path('verified-'+arch)/(os.environ['CLI_ARCHIVE_PREFIX']+'-'+arch)
                  for p in root.iterdir():
                      if p.name==os.environ['CLI_BINARY_NAME'] or p.suffix=='.dylib':
                          arches=subprocess.check_output(['lipo','-archs',str(p)],text=True).split()
                          require(set(arches)==({'arm64','x86_64'} if arch=='universal' else {arch}),'CLI slice mismatch')
                          identifier=os.environ['CLI_IDENTIFIER'] if p.name==os.environ['CLI_BINARY_NAME'] else os.environ['CLI_IDENTIFIER']+'.'+p.stem
                          requirement='identifier "'+identifier+'" and anchor apple generic and certificate leaf[subject.OU] = "'+os.environ['TEAM_ID']+'"'
                          subprocess.run(['codesign','--verify','--strict','-R='+requirement,str(p)],check=True)
                          subprocess.run(['python3',os.environ['RUNNER_TEMP']+'/sparkle-tools/notary.py','ticket',str(p)],check=True)
                          paths.append(p)
                          # Prove thin slices equal those removed from the signed universal image.
                          if arch!='universal':
                              source=Path('verified-universal')/(os.environ['CLI_ARCHIVE_PREFIX']+'-universal')/p.name
                              thin=Path(os.environ['RUNNER_TEMP'])/'thin-proof'
                              subprocess.run(['lipo',str(source),'-thin',arch,'-output',str(thin)],check=True)
                              require(p.read_bytes()==thin.read_bytes(),'thin CLI changed signed bytes')
          for p in paths:
              from contract import check_deployment
              check_deployment(p,os.environ['MINIMUM_SYSTEM_VERSION'])
              require(os.environ['EXPECTED_ARCH'] in subprocess.check_output(['lipo','-archs',str(p)],text=True).split() or str(p).startswith(('verified-universal/','verified-arm64/','verified-x86_64/')),'app code is missing the verifier architecture')
              subprocess.run(['codesign','--verify','--strict',str(p)],check=True)
              info=subprocess.run(['codesign','-dv','--verbose=4',str(p)],capture_output=True,text=True).stderr
              require('Authority='+os.environ['AUTHORITY']+'\n' in info and 'TeamIdentifier='+os.environ['TEAM_ID']+'\n' in info,'nested signer mismatch')
              if os.environ['VERIFY_RUNNER']=='macos-26' and os.environ['SWIFT_RUNTIME_AUDIT']=='true': require(audit(None,p)==0,'Swift runtime audit failed')
          # Check @rpath runtime companions slice-by-slice before executing the standalone CLI.
          if os.environ['CLI_BINARY_NAME']:
              root=Path('verified-universal')/(os.environ['CLI_ARCHIVE_PREFIX']+'-universal')
              from runtime_libraries import check_companions
              check_companions(root,os.environ['CLI_BINARY_NAME'])
              native=Path('verified-'+os.environ['EXPECTED_ARCH'])/(os.environ['CLI_ARCHIVE_PREFIX']+'-'+os.environ['EXPECTED_ARCH'])/os.environ['CLI_BINARY_NAME']
              environment={k:v for k,v in os.environ.items() if not any(x in k for x in ('TOKEN','SECRET','ACTIONS_','ASC_','P12','SPARKLE_PRIVATE'))}
              result=subprocess.check_output([str(native),'--version'],env=environment,text=True)
              from contract import cli_version_matches
              require(cli_version_matches(result,os.environ['VERSION']),'native CLI version mismatch')
              args=json.loads(os.environ['CLI_SMOKE_ARGS'])
              if args: subprocess.run([str(native),*args],env=environment,check=True)
          PYCODE
          python3 - <<'PYCODE'
          import os,json
          from pathlib import Path
          e=os.environ; root=Path('release-assets')
          attestation=dict(schemaVersion=1,repository=e['GITHUB_REPOSITORY'],runId=e['GITHUB_RUN_ID'],payloadArtifact=e['PAYLOAD_ARTIFACT'],tag=e['TAG'],commit=e['TARGET_SHA'],architecture=e['EXPECTED_ARCH'],runner=e['VERIFY_RUNNER'],verdict='verified',assetInventory=(root/'ASSET-INVENTORY.json').read_bytes().decode('utf-8'),sha256sums=(root/e['CHECKSUM_FILENAME']).read_bytes().decode('utf-8'),releaseNotes=(root/'RELEASE-NOTES.md').read_bytes().decode('utf-8'))
          Path('verified-sparkle-attestation.json').write_text(json.dumps(attestation,indent=2)+'\n')
          PYCODE
      - name: Upload verified-sparkle-${{ matrix.runner }}-${{ needs.package.outputs.artifact-name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-sparkle-${{ matrix.runner }}-${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/sparkle-payload/verified-sparkle-attestation.json
          if-no-files-found: error
          retention-days: 30
  publish:
    name: 8 · Publish verified Sparkle draft
    needs:
      - validate
      - package
      - draft
      - verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Download verified-sparkle-macos-15-${{ needs.package.outputs.artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-sparkle-macos-15-${{ needs.package.outputs.artifact-name }}
          path: attestations/macos-15
      - name: Download verified-sparkle-macos-15-intel-${{ needs.package.outputs.artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-sparkle-macos-15-intel-${{ needs.package.outputs.artifact-name }}
          path: attestations/macos-15-intel
      - name: Download verified-sparkle-macos-26-${{ needs.package.outputs.artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-sparkle-macos-26-${{ needs.package.outputs.artifact-name }}
          path: attestations/macos-26
      - name: Bind draft bytes and publish
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CHECKSUM_FILENAME: ${{ inputs.checksum-filename }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
          VERIFICATION_ARTIFACT: ${{ needs.package.outputs.artifact-name }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error("invalid draft ID");
            const paths = {
              'macos-15': 'attestations/macos-15/verified-sparkle-attestation.json',
              'macos-15-intel': 'attestations/macos-15-intel/verified-sparkle-attestation.json',
              'macos-26': 'attestations/macos-26/verified-sparkle-attestation.json',
            };
            const attestations = Object.fromEntries(
              Object.entries(paths).map(([architecture, file]) => [
                architecture,
                JSON.parse(fs.readFileSync(file, 'utf8')),
              ]),
            );
            for (const [architecture, attestation] of Object.entries(attestations)) {
              const expected = {
                schemaVersion: 1,
                repository: `${context.repo.owner}/${context.repo.repo}`,
                runId: String(context.runId),
                payloadArtifact: process.env.VERIFICATION_ARTIFACT,
                tag: process.env.TAG,
                commit: process.env.TARGET_SHA,
                architecture: architecture === 'macos-15-intel' ? 'x86_64' : 'arm64',
                runner: architecture,
                verdict: 'verified',
              };
              for (const [field, value] of Object.entries(expected))
                if (attestation[field] !== value)
                  throw new Error(`${architecture} attestation ${field} mismatch`);
            }
            for (const field of ['assetInventory', 'sha256sums', 'releaseNotes']) {
              if (Object.values(attestations).some(a => a[field] !== attestations['macos-15'][field]))
                throw new Error(`architecture ${field} disagreement`);
            }
            const checksumLines = attestations['macos-15'].sha256sums.trimEnd().split('\n');
            const expectedDigests = new Map();
            for (const line of checksumLines) {
              const match = /^([0-9a-f]{64})  ([^\r\n]+)$/.exec(line);
              if (!match || expectedDigests.has(match[2]))
                throw new Error('invalid or duplicate checksum line');
              expectedDigests.set(match[2], match[1]);
            }
            const before = await github.rest.repos.getRelease({ ...context.repo, release_id: releaseId });
            if (!before.data.draft || before.data.tag_name !== process.env.TAG || before.data.prerelease !== process.env.TAG.includes('-'))
              throw new Error('draft identity changed');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const downloadReleaseAsset = async (asset) => {
              const maxAttempts = 4;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                    {
                      ...context.repo,
                      asset_id: asset.id,
                      headers: { accept: 'application/octet-stream' },
                    },
                  );
                  return Buffer.from(response.data);
                } catch (error) {
                  const status = Number(error?.status);
                  if (!(status >= 500 && status <= 599) || attempt === maxAttempts) throw error;
                  const delayMs = 1000 * 2 ** (attempt - 1);
                  core.warning(
                    `GitHub returned ${status} while downloading draft asset ${JSON.stringify(asset.name)}; retrying in ${delayMs}ms (${attempt}/${maxAttempts - 1})`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, delayMs));
                }
              }
              throw new Error(`unreachable release asset retry state for ${JSON.stringify(asset.name)}`);
            };
            const downloaded = new Map();
            for (const asset of assets) {
              if (downloaded.has(asset.name)) throw new Error('duplicate draft asset');
              downloaded.set(asset.name, await downloadReleaseAsset(asset));
            }
            const expectedNames = [...expectedDigests.keys(), process.env.CHECKSUM_FILENAME].sort();
            if (JSON.stringify([...downloaded.keys()].sort()) !== JSON.stringify(expectedNames))
              throw new Error('draft asset inventory mismatch');
            if (
              downloaded.get(process.env.CHECKSUM_FILENAME).toString('utf8') !== attestations['macos-15'].sha256sums
            )
              throw new Error('draft checksum manifest differs from attestation');
            for (const [name, digest] of expectedDigests) {
              const observed = crypto.createHash('sha256').update(downloaded.get(name)).digest('hex');
              if (observed !== digest) throw new Error(`draft digest mismatch for ${name}`);
            }
            if (!downloaded.get('ASSET-INVENTORY.json').equals(Buffer.from(attestations['macos-15'].assetInventory)))
              throw new Error('draft inventory differs from attestation');
            if (!downloaded.get('RELEASE-NOTES.md').equals(Buffer.from(attestations['macos-15'].releaseNotes)))
              throw new Error('draft release notes differ from attestation');
            const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` });
            if (ref.data.object.type !== 'tag')
              throw new Error('release tag is no longer annotated');
            const tagObject = await github.rest.git.getTag({ ...context.repo, tag_sha: ref.data.object.sha });
            if (tagObject.data.object.type !== 'commit' || tagObject.data.object.sha !== process.env.TARGET_SHA)
              throw new Error('frozen tag target changed before publication');
            const published = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: releaseId,
              draft: false,
              body: attestations['macos-15'].releaseNotes + '\n\n## Verification\n\n' +
                `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                'Verified on macos-15 (arm64), macos-15-intel (x86_64), and macos-26 (arm64).\n\n' +
                'Toolchain and notarization submissions:\n```json\n' +
                JSON.stringify(JSON.parse(downloaded.get('SIGNING-MANIFEST.json')), null, 2) +
                '\n```\n\nChecksums:\n```text\n' + attestations['macos-15'].sha256sums + '\n```\n',
            });
            if (published.data.draft || !published.data.published_at)
              throw new Error('release did not become public');
            core.setOutput('release-url', published.data.html_url);
      - name: Verify authenticated public release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          [[ "$(jq -r '.draft' <<<"$response")" == false ]]
          [[ "$(jq -r '.tag_name' <<<"$response")" == "$TAG" ]]
    if: ${{ !inputs.dry-run }}
  handoff:
    name: 9 · Dispatch npm then Homebrew
    needs:
      - validate
      - publish
    if: ${{ !inputs.dry-run && (inputs.npm-publish-workflow != '' || inputs.homebrew-workflow != '') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await downstream workflows
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NPM_PUBLISH_WORKFLOW: ${{ inputs.npm-publish-workflow }}
          HOMEBREW_WORKFLOW: ${{ inputs.homebrew-workflow }}
          VERSION: ${{ needs.validate.outputs.release-version }}
          DEFAULT_BRANCH: ${{ needs.validate.outputs.default-branch }}
        with:
          script: |
            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            // BEGIN handoff
            async function handoff(workflow, schedule = wait, now = Date.now) {
              const params = {...context.repo, workflow_id: workflow, event: 'workflow_dispatch', per_page: 100};
              // Dispatch uses this workflow's GitHub Actions installation token.
              const actor = 'github-actions[bot]';
              const head = (await github.rest.repos.getBranch({...context.repo, branch: process.env.DEFAULT_BRANCH})).data.commit.sha;
              const prior = new Set((await github.paginate(github.rest.actions.listWorkflowRuns, params)).map(run => run.id));
              await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: workflow, ref: process.env.DEFAULT_BRANCH, inputs: {version: process.env.VERSION}});
              const deadline = now() + 900000;
              while (now() < deadline) {
                const runs = (await github.paginate(github.rest.actions.listWorkflowRuns, params)).filter(run => !prior.has(run.id) && run.head_sha === head && run.actor?.login === actor);
                if (runs.length > 1) throw new Error(`ambiguous dispatch correlation for ${workflow}`);
                const run = runs[0];
                if (run?.status === 'completed') {
                  if (run.conclusion !== 'success') throw new Error(`${workflow} failed: ${run.html_url}`);
                  core.info(`handoff verified: ${run.html_url}`);
                  return;
                }
                await schedule(15000);
              }
              throw new Error(`${workflow} timed out`);
            }
            // END handoff
            for (const workflow of [process.env.NPM_PUBLISH_WORKFLOW, process.env.HOMEBREW_WORKFLOW].filter(Boolean)) {
              try { await handoff(workflow); }
              catch (error) { throw new Error(`${error.message}. Release remains published; inspect the downstream run, then resume with workflow_dispatch ${workflow} version=${process.env.VERSION}. Do not rebuild or move the tag.`); }
            }
  closeout:
    name: 10 · Open appcast and Unreleased closeout PR
    needs:
      - validate
      - package
      - publish
      - handoff
    if: ${{ always() && !inputs.dry-run && needs.publish.result == 'success' && (needs.handoff.result == 'success' || needs.handoff.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Download ${{ needs.package.outputs.artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
      - name: Prepare safe release transport reader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          cat >"$RUNNER_TEMP/sparkle-tools/payload.py" <<'SOURCE'
          # BEGIN payload.py
          import re,shutil,tarfile
          from pathlib import Path

          def unpack_payload(archive,destination):
              destination=Path(destination)
              with tarfile.open(archive) as source:
                  members=source.getmembers(); seen=set()
                  for member in members:
                      name=member.name.rstrip('/')
                      if name=='release-assets' and member.isdir():continue
                      parts=name.split('/')
                      if len(parts)!=2 or parts[0]!='release-assets' or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,254}',parts[1]) or parts[1].endswith('.') or not member.isfile():
                          raise ValueError('unsafe release transport member')
                      key=name.casefold()
                      if key in seen:raise ValueError('duplicate release transport member')
                      seen.add(key)
                  if not seen:raise ValueError('empty release transport')
                  destination.mkdir(parents=True,exist_ok=False)
                  root=destination/'release-assets';root.mkdir()
                  # Never let tar extract paths, links, devices, or metadata on our behalf.
                  for member in members:
                      if member.isfile():
                          with source.extractfile(member) as src,(root/member.name.split('/')[1]).open('xb') as dst:
                              shutil.copyfileobj(src,dst)
          if __name__=='__main__':
              import sys
              unpack_payload(*sys.argv[1:])
          # END payload.py
          SOURCE
      - name: Unpack verified closeout payload
        run: |
          python3 "$RUNNER_TEMP/sparkle-tools/payload.py" sparkle-release-assets.tar.gz "$RUNNER_TEMP/sparkle-payload"
          cd "$RUNNER_TEMP/sparkle-payload"
      - name: Open one closeout PR without writing protected branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          APPCAST_PATH: ${{ inputs.appcast-path }}
          TAG: ${{ needs.validate.outputs.tag }}
          DEFAULT_BRANCH: ${{ needs.validate.outputs.default-branch }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
        with:
          script: |
            const fs = require('node:fs');
            const branch = `release/sparkle-closeout-${process.env.TAG}`;
            const existing = await github.rest.pulls.list({...context.repo, state:'open', head:`${context.repo.owner}:${branch}`, base:process.env.DEFAULT_BRANCH});
            if (existing.data.length) { core.info(`closeout PR already exists: ${existing.data[0].html_url}`); return; }
            const head = (await github.rest.repos.getBranch({...context.repo, branch:process.env.DEFAULT_BRANCH})).data.commit.sha;
            const read = async (path,ref) => {
              const response=await github.rest.repos.getContent({...context.repo,path,ref});
              if (Array.isArray(response.data) || response.data.type!=='file' || !/^[0-9a-f]{40}$/.test(response.data.sha))
                throw new Error('closeout target must be a regular file with a blob SHA');
              // Contents API object responses omit inline bytes above 1 MB.
              const blob = (await github.rest.git.getBlob({...context.repo,file_sha:response.data.sha})).data;
              if (blob.encoding!=='base64' || typeof blob.content!=='string')
                throw new Error('complete closeout blob content is unavailable');
              return Buffer.from(blob.content,'base64').toString('utf8');
            };
            const frozen = await read(process.env.APPCAST_PATH,process.env.TARGET_SHA);
            const current = await read(process.env.APPCAST_PATH,head);
            const published = fs.readFileSync(`${process.env.RUNNER_TEMP}/sparkle-payload/release-assets/appcast.xml`,'utf8');
            if (current !== frozen && current !== published) throw new Error('appcast changed since frozen release; reconcile it before resuming closeout');
            let changelog=await read('CHANGELOG.md',head);
            if (!/^## .*Unreleased/m.test(changelog)) {
              const index=changelog.search(/^## /m);
              const at=index<0?changelog.length:index;
              changelog=changelog.slice(0,at).trimEnd()+'\n\n## Unreleased\n\n'+changelog.slice(at);
            }
            const baseTree = (await github.rest.git.getCommit({...context.repo,commit_sha:head})).data.tree.sha;
            const tree = await github.rest.git.createTree({...context.repo,base_tree:baseTree,tree:[{path:process.env.APPCAST_PATH,mode:'100644',type:'blob',content:published},{path:'CHANGELOG.md',mode:'100644',type:'blob',content:changelog}]});
            const commit=await github.rest.git.createCommit({...context.repo,message:`chore: close out Sparkle release ${process.env.TAG}`,tree:tree.data.sha,parents:[head]});
            try { await github.rest.git.createRef({...context.repo,ref:`refs/heads/${branch}`,sha:commit.data.sha}); }
            catch (error) { if (error.status!==422) throw error; throw new Error('closeout branch already exists without an open PR; inspect and resume manually'); }
            try {
              const pr=await github.rest.pulls.create({...context.repo,base:process.env.DEFAULT_BRANCH,head:branch,title:`chore: close out ${process.env.TAG}`,body:'Publishes the verified appcast on the default branch and opens the next Unreleased section. Merge this PR to update the live Sparkle feed.'});
              core.info(pr.data.html_url);
            } catch(error) {
              throw new Error(`${error.message}. If GitHub Actions is not permitted to create or approve pull requests, enable Allow GitHub Actions to create and approve pull requests (can_approve_pull_request_reviews=true). Resume closeout from ${branch}.`);
            }
