          SOURCE
          cat >"$RUNNER_TEMP/sparkle-tools/inventory.py" <<'SOURCE'
          # BEGIN inventory.py
          import hashlib,json,os,re,stat
          from pathlib import Path

          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def files(root):
              entries=sorted(Path(root).iterdir())
              if any(not p.is_file() or p.is_symlink() for p in entries): raise ValueError('asset must be a regular file')
              names=[p.name for p in entries]
              if len({n.casefold() for n in names})!=len(names): raise ValueError('asset case collision')
              if any(not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,254}',n) or n.endswith('.') for n in names): raise ValueError('unsafe asset name')
              return entries

          def freeze(root,checksum,repository,tag,commit):
              root=Path(root); entries=files(root)
              if any(p.name.casefold() in (checksum.casefold(),'asset-inventory.json') for p in entries): raise ValueError('reserved asset collision')
              payloads=[dict(name=p.name,size=p.stat().st_size,sha256=digest(p)) for p in entries]
              (root/'ASSET-INVENTORY.json').write_text(json.dumps(dict(schemaVersion=1,repository=repository,tag=tag,commit=commit,payloads=payloads),indent=2)+'\n')
              (root/checksum).write_text(''.join(f'{digest(p)}  {p.name}\n' for p in files(root)))
              verify(root,checksum,repository,tag,commit)

          def verify(root,checksum,repository,tag,commit):
              root=Path(root); entries=files(root)
              lines=(root/checksum).read_text().splitlines(); hashes={}
              for line in lines:
                  m=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]{0,254})',line)
                  if not m or m[2] in hashes: raise ValueError('invalid or duplicate checksum line')
                  hashes[m[2]]=m[1]
              if set(hashes)!={p.name for p in entries if p.name!=checksum}: raise ValueError('checksum inventory mismatch')
              if any(digest(root/n)!=h for n,h in hashes.items()): raise ValueError('asset digest mismatch')
              inv=json.loads((root/'ASSET-INVENTORY.json').read_bytes().decode('utf-8'))
              for k,v in dict(schemaVersion=1,repository=repository,tag=tag,commit=commit).items():
                  if inv.get(k)!=v: raise ValueError('inventory identity mismatch')
              names=[p['name'] for p in inv['payloads']]
              if len(names)!=len(set(names)) or set(names)!=(set(hashes)-{'ASSET-INVENTORY.json'}): raise ValueError('inventory payload mismatch')
              for p in inv['payloads']:
                  if p['sha256']!=hashes[p['name']] or p['size']!=(root/p['name']).stat().st_size: raise ValueError('inventory digest/size mismatch')

          def bind_signed(original,final,checksum=None,npm_enabled=False):
              original=Path(original); final=Path(final)
              expected={p.name for p in files(original)}
              observed={p.name for p in files(final)}
              if checksum is not None:
                  expected.update({'RELEASE-NOTES.md','appcast.xml','appcast-entry.json','ASSET-INVENTORY.json',checksum})
                  npm={name for name in observed if name.endswith('.tgz')}
                  if len(npm)!=(1 if npm_enabled else 0): raise ValueError('unexpected npm asset set')
                  expected.update(npm)
              if observed!=expected: raise ValueError('unexpected final asset set')
              for path in files(original):
                  if (final/path.name).read_bytes()!=path.read_bytes(): raise ValueError('final payload differs from immutable signer artifact: '+path.name)

          def tree(root):
              from contract import tree as safe_tree
              safe_tree(root)
              root=Path(root); result=[]
              for parent,dirs,files in os.walk(root,followlinks=False):
                  for name in dirs+files:
                      p=Path(parent)/name; mode=p.lstat().st_mode
                      result.append((p.relative_to(root).as_posix(),stat.S_IMODE(mode), 'link' if p.is_symlink() else 'dir' if p.is_dir() else 'file',os.readlink(p) if p.is_symlink() else digest(p) if p.is_file() else ''))
              return sorted(result)

          def equal_trees(left,right):
              if tree(left)!=tree(right): raise ValueError('DMG embedded app tree differs from ZIP')
          # END inventory.py
          SOURCE
          cat >"$RUNNER_TEMP/sparkle-tools/appcast.py" <<'SOURCE'
          # BEGIN appcast.py
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          S='http://www.andymatuschak.org/xml-namespaces/sparkle'
          ET.register_namespace('sparkle',S)
          def fail(ok,message):
              if not ok: raise ValueError(message)
          def parse(xml):
              fail('<!DOCTYPE' not in xml.upper() and '<!ENTITY' not in xml.upper(),'DTD is not allowed')
              root=ET.fromstring(xml)
              fail(root.tag=='rss' and len(root.findall('channel'))==1,'appcast must have one RSS channel')
              return root,root.find('channel')
          def identity(item):
              enc=item.find('enclosure')
              fail(enc is not None,'missing enclosure')
              version=enc.get('{'+S+'}shortVersionString') or item.findtext('{'+S+'}shortVersionString')
              build=enc.get('{'+S+'}version') or item.findtext('{'+S+'}version')
              fail(bool(version) and bool(re.fullmatch(r'[1-9][0-9]*',build or '')),'missing version/build')
              return version,int(build)
          def validate(xml,entry):
              root,ch=parse(xml)
              items=ch.findall('item')
              ids=[identity(x) for x in items]
              fail(len({v for v,b in ids})==len(ids),'duplicate appcast version')
              fail(all(ids[i][1]>ids[i+1][1] for i in range(len(ids)-1)),'appcast builds must strictly descend')
              fail(ids and ids[0]==(entry['version'],int(entry['buildNumber'])),'new item must be first')
              item=items[0]; enc=item.find('enclosure')
              for field,key in [('url','assetUrl'),('length','zipLength'),('{'+S+'}edSignature','edSignature'),('{'+S+'}shortVersionString','version')]:
                  fail(enc.get(field)==str(entry[key]),'appcast enclosure mismatch: '+key)
              fail('{'+S+'}minimumSystemVersion' not in enc.attrib,'minimumSystemVersion must be an item child')
              channel=re.search(r'-(alpha|beta|rc)\.[0-9]+$',entry['version'])
              expected_channel=channel.group(1) if channel else None
              fail(item.findtext('{'+S+'}channel')==expected_channel,'appcast release channel mismatch')
              for field,key in [('link','releaseUrl'),('{'+S+'}releaseNotesLink','releaseUrl'),('{'+S+'}minimumSystemVersion','minimumSystemVersion'),('title','title'),('pubDate','pubDate')]:
                  fail(item.findtext(field)==str(entry[key]),'appcast item mismatch: '+key)
              return root

          def update(xml,entry):
              root,ch=parse(xml)
              ids=[identity(x) for x in ch.findall('item')]
              fail(bool(re.fullmatch(r'[1-9][0-9]*',entry['buildNumber'])),'invalid new build')
              fail(all(v!=entry['version'] for v,b in ids),'version already published')
              fail(all(b<int(entry['buildNumber']) for v,b in ids),'new build must increase')
              item=ET.Element('item')
              for name,value in [('title',entry['title']),('link',entry['releaseUrl']),('{'+S+'}releaseNotesLink',entry['releaseUrl']),('pubDate',entry['pubDate']),('{'+S+'}minimumSystemVersion',entry['minimumSystemVersion'])]:
                  ET.SubElement(item,name).text=str(value)
              ET.SubElement(item,'enclosure',{'url':entry['assetUrl'],'length':str(entry['zipLength']),'type':'application/octet-stream','{'+S+'}version':entry['buildNumber'],'{'+S+'}shortVersionString':entry['version'],'{'+S+'}edSignature':entry['edSignature']})
              channel=re.search(r'-(alpha|beta|rc)\.[0-9]+$',entry['version'])
              if channel: ET.SubElement(item,'{'+S+'}channel').text=channel.group(1)
              first=ch.find('item'); ch.insert(list(ch).index(first) if first is not None else len(ch),item)
              ET.indent(root,space='  ')
              result=ET.tostring(root,encoding='unicode',xml_declaration=True)+'\n'
              validate(result,entry)
              return result
          # END appcast.py
          SOURCE
          cat >"$RUNNER_TEMP/sparkle-tools/sparkle.cjs" <<'SOURCE'
          // BEGIN sparkle.cjs
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const publicKey = (text) => {
            const bytes = Buffer.from(text, 'base64');
            if (bytes.length !== 32 || bytes.toString('base64') !== text) throw new Error('invalid Sparkle public key');
            return crypto.createPublicKey({key: Buffer.concat([Buffer.from('302a300506032b6570032100','hex'), bytes]), format:'der', type:'spki'});
          };
          function checkPrivate(seedText, expected) {
            const seed = Buffer.from(seedText.trim(),'base64');
            if (seed.length !== 32 || seed.toString('base64') !== seedText.trim()) throw new Error('Sparkle private key must be a base64 32-byte seed exported by generate_keys');
            const key = crypto.createPrivateKey({key: Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),seed]),format:'der',type:'pkcs8'});
            const derived = crypto.createPublicKey(key).export({format:'der',type:'spki'});
            if (!derived.equals(publicKey(expected).export({format:'der',type:'spki'}))) throw new Error('Sparkle private/public key mismatch');
          }
          function verify(file, signature, expected) {
            const sig=Buffer.from(signature,'base64');
            if (sig.length !== 64 || sig.toString('base64') !== signature || !crypto.verify(null,fs.readFileSync(file),publicKey(expected),sig)) throw new Error('Sparkle signature mismatch');
          }
          module.exports={checkPrivate,verify};
          if (require.main===module) {
            if(process.argv[2]==='private') checkPrivate(fs.readFileSync(process.argv[3],'utf8'),process.env.SPARKLE_PUBLIC_KEY);
            else verify(process.argv[3],process.argv[4],process.env.SPARKLE_PUBLIC_KEY);
          }
          // END sparkle.cjs
          SOURCE
          cat >"$RUNNER_TEMP/sparkle-tools/npm.py" <<'SOURCE'
          # BEGIN npm.py
          import tarfile,json
          from pathlib import Path
          from contract import require

          def verify_package(cli_path,npm_path,prefix,binary,version):
              with tarfile.open(cli_path) as cli:
                  binary_bytes=cli.extractfile(prefix+'-universal/'+binary).read()
                  companions={p.name.rsplit('/',1)[-1]:cli.extractfile(p).read() for p in cli if p.isfile() and p.name.endswith('.dylib')}
              with tarfile.open(npm_path) as npm:
                  members=npm.getmembers(); names=[p.name for p in members]
                  require(len(names)==len(set(names)) and len(names)==len({n.casefold() for n in names}),'duplicate npm member')
                  require(all(not p.issym() and not p.islnk() and (p.isfile() or p.isdir()) and p.name.startswith('package/') and all(x not in ('','..','.') for x in p.name.rstrip('/').split('/')) and '\\' not in p.name for p in members),'unsafe npm member')
                  metadata=json.loads(npm.extractfile('package/package.json').read())
                  require(metadata.get('version')==version,'npm package version mismatch')
                  candidates=[p for p in members if p.isfile() and p.name.rsplit('/',1)[-1]==binary]
                  require(len(candidates)==1 and npm.extractfile(candidates[0]).read()==binary_bytes,'npm embedded binary differs from signed universal binary')
                  require(candidates[0].mode & 0o111,'npm binary is not executable')
                  directory=candidates[0].name.rsplit('/',1)[0]
                  for name,data in companions.items(): require(npm.extractfile(directory+'/'+name).read()==data,'npm companion differs from signed companion')
          # END npm.py
          SOURCE
      - name: Bind npm bytes, generate appcast, and freeze inventory
        env:
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle-identifier }}
          MINIMUM_SYSTEM_VERSION: ${{ inputs.minimum-system-version }}
          SPARKLE_PUBLIC_KEY: ${{ inputs.sparkle-public-key }}
