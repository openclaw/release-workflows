name: Release Sparkle App
on:
  workflow_call:
    inputs:
      version:
        description: SemVer X.Y.Z or X.Y.Z-(alpha|beta|rc).N, with optional leading v
        required: true
        type: string
      repository-type:
        description: 'Signing policy: openclaw or personal'
        required: true
        type: string
      signing-environment:
        description: Preconfigured approval-gated caller environment
        required: false
        type: string
        default: release
      build-runner:
        description: Fresh GitHub-hosted macOS runner label
        required: false
        type: string
        default: xcode-27
      xcode-path:
        description: Optional absolute Xcode Contents/Developer path
        required: false
        type: string
        default: ''
      checksum-filename:
        description: Published checksum manifest filename
        required: false
        type: string
        default: checksums.txt
      ci-check-events:
        description: JSON array of accepted Actions CI events
        required: false
        type: string
        default: '["push","pull_request"]'
      app-name:
        description: App bundle name without .app
        required: true
        type: string
      bundle-identifier:
        description: Stable app code-signing identifier
        required: true
        type: string
      minimum-system-version:
        description: Minimum macOS version, at most 15.0
        required: true
        type: string
      app-build-script:
        description: Tracked executable producing dist/sparkle-app/<app-name>.app
        required: true
        type: string
      app-entitlements:
        description: Tracked entitlements plist read only as data
        required: true
        type: string
      sparkle-public-key:
        description: Base64 32-byte Ed25519 public key
        required: true
        type: string
      appcast-feed-url:
        description: HTTPS feed URL matching SUFeedURL
        required: true
        type: string
      dmg-background:
        description: Tracked PNG with the layout window dimensions
        required: true
        type: string
      dmg-layout:
        description: JSON window-size, icon-size, app-position, applications-position, volume-name
        required: true
        type: string
      appcast-path:
        description: Tracked appcast XML updated by closeout
        required: false
        type: string
        default: appcast.xml
      sparkle-version:
        description: Checksum-pinned Sparkle signing tools version
        required: false
        type: string
        default: 2.10.0
      cli-build-script:
        description: Tracked executable producing dist/sparkle-cli/
        required: false
        type: string
        default: ''
      cli-binary-name:
        description: Standalone universal CLI filename
        required: false
        type: string
        default: ''
      cli-identifier:
        description: Stable standalone CLI code-signing identifier
        required: false
        type: string
        default: ''
      cli-archive-prefix:
        description: CLI archive prefix, without architecture
        required: false
        type: string
        default: ''
      npm-pack-script:
        description: Tracked executable emitting exactly one dist/sparkle-npm/*.tgz
        required: false
        type: string
        default: ''
      npm-publish-workflow:
        description: Caller workflow file dispatched with version after publication
        required: false
        type: string
        default: ''
      homebrew-workflow:
        description: Caller workflow file dispatched with version after npm succeeds
        required: false
        type: string
        default: ''
      cli-smoke-args:
        description: JSON argv array run after --version
        required: false
        type: string
        default: '[]'
      swift-runtime-audit:
        description: Audit strong Swift imports against the oldest installed SDK older than 27
        required: false
        type: boolean
        default: true
      require-signed-tag:
        description: Require an existing SSH-signed version tag for publication
        type: boolean
        default: false
      dry-run:
        description: Real signing and verification without public writes
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_SIGNING_P12:
        required: true
      MACOS_SIGNING_P12_PASSWORD:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY_P8:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: true
    outputs:
      release-id:
        value: ${{ jobs.draft.outputs.release-id }}
      release-url:
        value: ${{ jobs.publish.outputs.release-url }}
permissions: {}
concurrency:
  group: release-sparkle-app-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    name: 1 · Validate frozen Sparkle source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    outputs:
      default-branch: ${{ steps.source.outputs.default-branch }}
      release-notes-artifact-name: ${{ steps.metadata.outputs.release-notes-artifact-name }}
      frozen-inputs-id: ${{ steps.frozen-upload.outputs.artifact-id }}
      release-version: ${{ steps.inputs.outputs.release-version }}
      tag: ${{ steps.inputs.outputs.tag }}
      tag-object-sha: ${{ steps.source.outputs.tag-object-sha }}
      target-sha: ${{ steps.source.outputs.target-sha }}
    steps:
      - name: Prepare workflow-owned release tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          cat >"$RUNNER_TEMP/sparkle-tools/contract.py" <<'SOURCE'
          # BEGIN contract.py
          import base64, json, os, re, struct
          from pathlib import Path, PurePosixPath

          def require(ok, message):
              if not ok: raise ValueError(message)
          def cli_version_matches(output, expected):
              versions=re.findall(r'(?<![0-9A-Za-z.+-])v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)(?![0-9A-Za-z.+-])',output)
              return versions == [expected]
          def safe_path(value):
              require(bool(re.fullmatch(r'[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*', value)), 'unsafe repo-relative path')
              require(all(part not in ('', '.', '..') for part in value.split('/')), 'unsafe path component')
          def safe_name(value):
              require(bool(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,180}', value)) and not value.endswith('.'), 'unsafe asset name')
          def json_input(value,label):
              try: return json.loads(value)
              except ValueError: raise ValueError(label+' must be valid JSON') from None
          def layout(value):
              d=json_input(value,'dmg-layout')
              require(isinstance(d,dict) and set(d)=={'window-size','icon-size','app-position','applications-position','volume-name'}, 'invalid dmg-layout keys')
              for key in ('window-size','app-position','applications-position'):
                  require(isinstance(d[key],list) and len(d[key])==2 and all(type(v) is int and 0 <= v <= 4096 for v in d[key]), 'invalid layout pair')
              w,h=d['window-size']
              require(w>=200 and h>=200, 'invalid window size')
              require(type(d['icon-size']) is int and 16<=d['icon-size']<=512, 'invalid icon size')
              for key in ('app-position','applications-position'):
                  require(0 < d[key][0] < w and 0 < d[key][1] < h, 'icon outside window')
              require(isinstance(d['volume-name'],str) and 0<len(d['volume-name'])<=80 and not re.search(r'[/\\:\x00-\x1f\x7f]',d['volume-name']), 'invalid volume name')
              return d

          def tree(root):
              root=Path(root)
              require(root.is_dir() and not root.is_symlink(), 'invalid tree root')
              resolved=root.resolve()
              seen=set()
              for parent, dirs, files in os.walk(root,followlinks=False):
                  for name in dirs+files:
                      p=Path(parent)/name
                      rel=p.relative_to(root).as_posix()
                      import unicodedata
                      key=unicodedata.normalize('NFD',rel).casefold()
                      require(key not in seen and not re.search(r'[\x00-\x1f\x7f\\]',rel), 'ambiguous tree member')
                      seen.add(key)
                      if p.is_symlink(): require(p.resolve(strict=True).is_relative_to(resolved), 'symlink escapes tree')
                      else: require(p.is_file() or p.is_dir(), 'special file in tree')

          def check_deployment(binary, maximum):
              import subprocess
              def version(value): return tuple((list(map(int,value.split('.')))+[0,0,0])[:3])
              for arch in subprocess.check_output(['lipo','-archs',str(binary)],text=True).split():
                  output=subprocess.check_output(['otool','-arch',arch,'-l',str(binary)],text=True)
                  minima=[]
                  for block in re.split(r'(?m)^\s*cmd ',output)[1:]:
                      kind=block.splitlines()[0].strip()
                      if kind not in ('LC_BUILD_VERSION','LC_VERSION_MIN_MACOSX'):continue
                      fields=dict(re.findall(r'(?m)^\s*(platform|minos|version)\s+(\S+)\s*$',block))
                      if kind=='LC_BUILD_VERSION':
                          platform=fields.get('platform','').lower()
                          # Zippered dylibs also describe Catalyst, whose minimum is iOS-numbered.
                          if platform in ('6','maccatalyst'):continue
                          require(platform in ('1','macos'),'non-macOS Mach-O platform')
                      value=fields.get('minos' if kind=='LC_BUILD_VERSION' else 'version','')
                      require(bool(re.fullmatch(r'[0-9]+(?:\.[0-9]+)*',value)),'missing Mach-O minimum OS')
                      minima.append(version(value))
                  require(bool(minima) and max(minima)<=version(maximum),'Mach-O requires newer macOS than minimum-system-version')

          if __name__=='__main__':
              e=os.environ
              version=e['VERSION'].removeprefix('v')
              require(bool(re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.(0|[1-9][0-9]*))?',version)), 'invalid SemVer')
              require(e['REPOSITORY_TYPE'] in ('openclaw','personal'), 'invalid repository-type')
              require(e['BUILD_RUNNER'] in ('xcode-27','macos-15','macos-15-intel','macos-26'), 'unsupported build-runner')
              require(bool(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9 _-]{0,79}', e['SIGNING_ENVIRONMENT'])), 'invalid signing-environment')
              if e['XCODE_PATH']: require(bool(re.fullmatch(r'/Applications/Xcode[A-Za-z0-9._ -]*\.app/Contents/Developer',e['XCODE_PATH'])), 'invalid Xcode developer path')
              for name in ('APP_NAME','CHECKSUM_FILENAME'): safe_name(e[name])
              require(bool(e['BUNDLE_IDENTIFIER']), 'bundle-identifier is required')
              for name in ('BUNDLE_IDENTIFIER','CLI_IDENTIFIER'):
                  if e[name]: require(bool(re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', e[name])), 'invalid signing identifier')
              for name in ('APP_BUILD_SCRIPT','APP_ENTITLEMENTS','APPCAST_PATH','DMG_BACKGROUND'): safe_path(e[name])
              for name in ('CLI_BUILD_SCRIPT','NPM_PACK_SCRIPT','NPM_PUBLISH_WORKFLOW','HOMEBREW_WORKFLOW'):
                  if e[name]: safe_path(e[name])
              for name in ('NPM_PUBLISH_WORKFLOW','HOMEBREW_WORKFLOW'):
                  if e[name]: require('/' not in e[name] and e[name].endswith(('.yml','.yaml')), 'handoff must name a workflow file')
              cli=bool(e['CLI_BUILD_SCRIPT'])
              require(all(bool(e[k])==cli for k in ('CLI_BINARY_NAME','CLI_IDENTIFIER','CLI_ARCHIVE_PREFIX')), 'CLI inputs must be supplied together')
              for key in ('CLI_BINARY_NAME','CLI_ARCHIVE_PREFIX'):
                  if cli: safe_name(e[key])
              require(not e['NPM_PACK_SCRIPT'] or cli, 'npm packing requires CLI')
              require(not e['NPM_PUBLISH_WORKFLOW'] or e['NPM_PACK_SCRIPT'], 'npm publication requires npm pack')
              require(bool(re.fullmatch(r'(?:[0-9]+\.){1,2}[0-9]+',e['MINIMUM_SYSTEM_VERSION'])), 'invalid minimum-system-version')
              require(tuple(map(int,e['MINIMUM_SYSTEM_VERSION'].split('.'))) <= (15,0,0), 'minimum macOS must be at most 15.0')
              key=base64.b64decode(e['SPARKLE_PUBLIC_KEY'],validate=True)
              require(len(key)==32 and base64.b64encode(key).decode()==e['SPARKLE_PUBLIC_KEY'], 'invalid Sparkle public key')
              from urllib.parse import urlsplit
              url=urlsplit(e['APPCAST_FEED_URL'])
              require(url.scheme=='https' and bool(url.hostname) and not url.username and not url.password and not url.fragment and not re.search(r'[\x00-\x20\x7f]',e['APPCAST_FEED_URL']), 'invalid appcast-feed-url')
              require(e['SPARKLE_VERSION']=='2.10.0', 'unsupported checksum-pinned Sparkle version')
              events=json_input(e['CI_CHECK_EVENTS'],'ci-check-events')
              require(isinstance(events,list) and all(isinstance(x,str) and re.fullmatch('[a-z][a-z0-9_]*',x) for x in events) and len(events)==len(set(events)), 'invalid CI events')
              args=json_input(e['CLI_SMOKE_ARGS'],'cli-smoke-args')
              require(isinstance(args,list) and all(isinstance(x,str) and not re.search(r'[\x00-\x1f]',x) for x in args), 'cli-smoke-args must be a JSON argv array')
              layout(e['DMG_LAYOUT'])
              names=['ASSET-INVENTORY.json','RELEASE-NOTES.md','SIGNING-MANIFEST.json','appcast.xml','appcast-entry.json',f'{e["APP_NAME"]}-{version}.app.zip',f'{e["APP_NAME"]}-{version}.dmg']
              if cli: names += [e['CLI_ARCHIVE_PREFIX']+'-'+a+'.tar.gz' for a in ('universal','arm64','x86_64')]
              require(e['CHECKSUM_FILENAME'].casefold() not in {x.casefold() for x in names}, 'checksum-filename collides with release asset')
              with open(e['GITHUB_OUTPUT'],'a') as output: output.write(f'release-version={version}\ntag=v{version}\n')
          # END contract.py
          SOURCE
      - name: Validate inputs
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY_TYPE: ${{ inputs.repository-type }}
          SIGNING_ENVIRONMENT: ${{ inputs.signing-environment }}
          BUILD_RUNNER: ${{ inputs.build-runner }}
          XCODE_PATH: ${{ inputs.xcode-path }}
          CHECKSUM_FILENAME: ${{ inputs.checksum-filename }}
          CI_CHECK_EVENTS: ${{ inputs.ci-check-events }}
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle-identifier }}
          MINIMUM_SYSTEM_VERSION: ${{ inputs.minimum-system-version }}
          APP_BUILD_SCRIPT: ${{ inputs.app-build-script }}
          APP_ENTITLEMENTS: ${{ inputs.app-entitlements }}
          SPARKLE_PUBLIC_KEY: ${{ inputs.sparkle-public-key }}
          APPCAST_FEED_URL: ${{ inputs.appcast-feed-url }}
          DMG_BACKGROUND: ${{ inputs.dmg-background }}
          DMG_LAYOUT: ${{ inputs.dmg-layout }}
          APPCAST_PATH: ${{ inputs.appcast-path }}
          SPARKLE_VERSION: ${{ inputs.sparkle-version }}
          CLI_BUILD_SCRIPT: ${{ inputs.cli-build-script }}
          CLI_BINARY_NAME: ${{ inputs.cli-binary-name }}
          CLI_IDENTIFIER: ${{ inputs.cli-identifier }}
          CLI_ARCHIVE_PREFIX: ${{ inputs.cli-archive-prefix }}
          NPM_PACK_SCRIPT: ${{ inputs.npm-pack-script }}
          NPM_PUBLISH_WORKFLOW: ${{ inputs.npm-publish-workflow }}
          HOMEBREW_WORKFLOW: ${{ inputs.homebrew-workflow }}
          CLI_SMOKE_ARGS: ${{ inputs.cli-smoke-args }}
          SWIFT_RUNTIME_AUDIT: ${{ inputs.swift-runtime-audit }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sparkle-tools/contract.py"
      - name: Resolve protected release target
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const repo = await github.rest.repos.get(context.repo);
            const branchName = repo.data.default_branch;
            const tagPush = context.eventName === 'push' && context.ref === `refs/tags/${process.env.TAG}`;
            if (!tagPush && !process.env.GITHUB_WORKFLOW_REF.endsWith(`@refs/heads/${branchName}`)) {
              core.setFailed(`caller workflow must run from protected ${branchName}`);
              return;
            }
            const branch = await github.rest.repos.getBranch({
              ...context.repo,
              branch: branchName,
            });
            if (!branch.data.protected) {
              core.setFailed(`default branch ${branchName} is not protected`);
              return;
            }
            const branchHead = branch.data.commit.sha;
            if (!tagPush && (context.ref !== `refs/heads/${branchName}` || context.sha !== branchHead)) {
              core.setFailed(`caller must run at protected ${branchName} head ${branchHead}; got ${context.ref}@${context.sha}`);
              return;
            }

            let targetSha = branchHead;
            let targetSource = 'protected-head';
            let tagObjectSha = '';
            let existingTag = null;
            try {
              if (process.env.DRY_RUN !== 'true') existingTag = await github.rest.git.getRef({
                ...context.repo,
                ref: `tags/${process.env.TAG}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingTag !== null) {
              if (existingTag.data.object.type !== 'tag') {
                core.setFailed(`existing tag is lightweight, not annotated: ${process.env.TAG}`);
                return;
              }
              tagObjectSha = existingTag.data.object.sha;
              const tagObject = await github.rest.git.getTag({
                ...context.repo,
                tag_sha: tagObjectSha,
              });
              if (tagObject.data.object.type !== 'commit') {
                core.setFailed(`annotated tag does not peel directly to a commit: ${process.env.TAG}`);
                return;
              }
              targetSha = tagObject.data.object.sha;
              targetSource = 'annotated-tag';

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${targetSha}...${branchHead}`,
                per_page: 1,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.setFailed(`tag commit ${targetSha} is not reachable from protected ${branchName} head ${branchHead}`);
                return;
              }
              core.info(`retry target frozen by annotated tag ${process.env.TAG} at ${targetSha}`);
            } else {
              core.info(`first-attempt target is protected ${branchName} head ${branchHead}`);
            }
            if (tagPush && (!existingTag || ![targetSha,tagObjectSha].includes(context.sha))) throw new Error('tag event does not match immutable tag');
            core.setOutput('default-branch', branchName);
            core.setOutput('tag-object-sha', tagObjectSha);
            core.setOutput('target-sha', targetSha);
            core.setOutput('target-source', targetSource);
      - name: Check out exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.source.outputs.target-sha }}
      - name: Verify release tag signature
        if: inputs.require-signed-tag && !inputs.dry-run
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          TARGET_SHA: ${{ steps.source.outputs.target-sha }}
        run: |
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$TARGET_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$TAG"
      - name: Freeze release notes and data inputs
        id: metadata
        env:
          APP_BUILD_SCRIPT: ${{ inputs.app-build-script }}
          APP_ENTITLEMENTS: ${{ inputs.app-entitlements }}
          APPCAST_PATH: ${{ inputs.appcast-path }}
          DMG_BACKGROUND: ${{ inputs.dmg-background }}
          CLI_BUILD_SCRIPT: ${{ inputs.cli-build-script }}
          NPM_PACK_SCRIPT: ${{ inputs.npm-pack-script }}
          RELEASE_VERSION: ${{ steps.inputs.outputs.release-version }}
        run: |
          set -euo pipefail
          for path in CHANGELOG.md "$APP_BUILD_SCRIPT" "$APP_ENTITLEMENTS" "$APPCAST_PATH" "$DMG_BACKGROUND" "$CLI_BUILD_SCRIPT" "$NPM_PACK_SCRIPT"; do
            [[ -n "$path" ]] || continue
            entry=$(git ls-tree HEAD -- "$path")
            mode=${entry%% *}
            entry_path=${entry#*$'\t'}
            [[ "$entry_path" == "$path" && ( "$mode" == 100644 || "$mode" == 100755 ) ]] || { echo "release input must be a tracked regular file: $path" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/frozen-inputs"
          cp "$APP_ENTITLEMENTS" "$RUNNER_TEMP/frozen-inputs/app.entitlements"
          cp "$APPCAST_PATH" "$RUNNER_TEMP/frozen-inputs/appcast.xml"
          cp "$DMG_BACKGROUND" "$RUNNER_TEMP/frozen-inputs/background.png"
          if [[ -n "$CLI_BUILD_SCRIPT" ]]; then
            [[ "$(git ls-tree HEAD -- LICENSE)" == 100644* || "$(git ls-tree HEAD -- LICENSE)" == 100755* ]]
            cp LICENSE "$RUNNER_TEMP/frozen-inputs/LICENSE"
          fi
          python3 - "$RELEASE_VERSION" "$RUNNER_TEMP/RELEASE-NOTES.md" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, output = sys.argv[1:]
          raw = Path("CHANGELOG.md").read_bytes()
          text = raw.decode("utf-8")
          version_pattern = re.compile(rf"(?<![0-9A-Za-z.])v?{re.escape(version)}(?![0-9A-Za-z.+-])")
          date_pattern = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")
          heading_pattern = re.compile(r"^##[ \t]+")
          fence_pattern = re.compile(r"^[ ]{0,3}(`{3,}|~{3,})")
          def fence_marker(content):
              opening = fence_pattern.match(content)
              if opening and (opening.group(1)[0] == "~" or "`" not in content[opening.end():]):
                  return opening.group(1)
              return None

          def paragraph_tail(start):
              tail = text[start:]
              boundary = re.search(r"\n(?:[ \t]*\r?\n|[ ]{0,3}#{1,6}(?:[ \t]|$)|[ ]{0,3}<!--)", tail, re.M)
              if boundary:
                  tail = tail[:boundary.start()]
              for candidate in re.finditer(r"\n([^\r\n]*)", tail):
                  if fence_marker(candidate.group(1)):
                      return tail[:candidate.start()]
              return tail

          headings = []
          offset = 0
          fence = None
          in_comment = False
          inline_end = -1
          for line in text.splitlines(keepends=True):
              content = line.rstrip("\r\n")
              if fence is not None:
                  closing = re.match(rf"^[ ]{{0,3}}{re.escape(fence[0])}{{{fence[1]},}}[ \t]*$", content)
                  if closing:
                      fence = None
                  offset += len(line)
                  continue

              if not in_comment:
                  opening = fence_marker(content)
                  if opening:
                      fence = (opening[0], len(opening))
                      offset += len(line)
                      continue
                  if heading_pattern.match(content):
                      headings.append((offset, offset + len(line), content))

              cursor = 0
              while cursor < len(content):
                  if in_comment:
                      closing = content.find("-->", cursor)
                      if closing < 0:
                          break
                      in_comment = False
                      cursor = closing + 3
                  elif offset + cursor < inline_end:
                      cursor = min(len(content), inline_end - offset)
                  elif content[cursor] == "\\":
                      cursor += 2
                  elif content[cursor] == "`":
                      marker = re.match(r"`+", content[cursor:]).group()
                      tail_start = offset + cursor + len(marker)
                      tail = paragraph_tail(tail_start)
                      closing = re.search(r"(?<!`)" + marker + r"(?!`)", tail)
                      if closing:
                          inline_end = tail_start + closing.end()
                      cursor += len(marker)
                  elif content.startswith("<!--", cursor):
                      block_start = cursor <= 3 and content[:cursor] == " " * cursor
                      if content.startswith("<!--->", cursor):
                          cursor += 6
                      elif content.startswith("<!-->", cursor):
                          cursor += 5
                      elif block_start:
                          in_comment = True
                          cursor += 4
                      else:
                          tail_start = offset + cursor + 4
                          closing = paragraph_tail(tail_start).find("-->")
                          if closing >= 0:
                              inline_end = tail_start + closing + 3
                          cursor += 4
                  else:
                      cursor += 1
              offset += len(line)

          matches = [
              candidate
              for candidate in headings
              if re.fullmatch(rf"##[ \t]+v?{re.escape(version)} - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}[ \t]*", candidate[2])
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"CHANGELOG.md needs exactly one dated level-two section for {version}; found {len(matches)}"
              )
          match = matches[0]
          end = next((candidate[0] for candidate in headings if candidate[0] > match[0]), len(text))
          section = text[match[0]:end]
          Path(output).write_bytes(section.encode("utf-8"))
