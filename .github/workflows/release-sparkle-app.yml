          cat >"$RUNNER_TEMP/sparkle-tools/downloader.py" <<'SOURCE'
          # BEGIN downloader.py
          import json,os,plistlib,subprocess,sys,tempfile
          from pathlib import Path
          from contract import require

          def paths(app):
              app=Path(app).resolve()
              framework=app/'Contents/Frameworks/Sparkle.framework'
              current=framework/'Versions/Current'
              require(current.is_symlink(),'missing Sparkle Current alias')
              version=current.resolve(strict=True)
              require(version.parent==framework/'Versions','Sparkle version escapes framework')
              bundle=version/'XPCServices/Downloader.xpc'
              info=bundle/'Contents/Info.plist'
              require(info.is_file() and not info.is_symlink(),'missing regular Downloader Info.plist')
              name=plistlib.loads(info.read_bytes()).get('CFBundleExecutable','')
              require(isinstance(name,str) and name not in ('','.','..') and '/' not in name,'invalid Downloader executable')
              executable=bundle/'Contents/MacOS'/name
              require(executable.is_file() and not executable.is_symlink(),'missing physical Downloader executable')
              require(bundle.is_dir() and not bundle.is_symlink(),'missing physical Downloader bundle')
              return app,bundle,executable

          def canonical(data):
              require(isinstance(data,dict),'Downloader entitlements must be a dictionary')
              if 'com.apple.security.app-sandbox' in data:
                  require(data['com.apple.security.app-sandbox'] is True,'Downloader app-sandbox entitlement must be true')
              return plistlib.dumps(data,sort_keys=True).decode('utf-8')

          def read(path,arch,allow_unsigned=False):
              result=subprocess.run(['codesign','--display','--arch',arch,'--xml','--entitlements','-',str(path)],capture_output=True,env={**os.environ,'LC_ALL':'C'})
              if allow_unsigned and result.returncode==1 and result.stderr.endswith(b': code object is not signed at all\n'):
                  require(not result.stdout,'unexpected unsigned Downloader entitlements')
                  return canonical({})
              require(result.returncode==0,'cannot read Downloader entitlements: '+str(path)+' ('+arch+')')
              return canonical(plistlib.loads(result.stdout) if result.stdout.strip() else {})

          def capture(app,allow_unsigned=False):
              app,bundle,executable=paths(app)
              values=[read(path,arch,allow_unsigned) for path in (bundle,executable) for arch in ('arm64','x86_64')]
              require(len(set(values))==1,'Downloader entitlements differ between bundle, executable or architectures')
              return {'bundle':str(bundle.relative_to(app)),'entitlements':values[0]}

          def verify(app,record,allow_unsigned=False):
              require(capture(app,allow_unsigned)==record,'Downloader entitlements differ from frozen pre-signing record')

          def sign(app,record):
              from signing import signing_paths
              verify(app,record,allow_unsigned=True)
              _,bundle,executable=paths(app)
              # Reapply frozen XML explicitly: preserve-metadata can ignore linker-signed input.
              with tempfile.NamedTemporaryFile(dir=os.environ['RUNNER_TEMP'],suffix='.entitlements') as entitlements:
                  entitlements.write(record['entitlements'].encode('utf-8'));entitlements.flush()
                  for item in signing_paths(app):
                      extra=['--entitlements',entitlements.name] if item in (bundle,executable) and plistlib.loads(record['entitlements'].encode('utf-8')) else []
                      subprocess.run(['codesign','--force','--timestamp','--options','runtime',*extra,'--keychain',os.environ['KEYCHAIN'],'--sign',os.environ['IDENTITY'],str(item)],check=True)
              verify(app,record)

          if __name__=='__main__':
              command,app,record=sys.argv[1:]
              if command=='capture': Path(record).write_text(json.dumps(capture(app,allow_unsigned=True),sort_keys=True)+'\n')
              elif command=='sign': sign(app,json.loads(Path(record).read_text()))
              elif command=='verify': verify(app,json.loads(Path(record).read_text()))
              elif command=='verify-manifest': verify(app,json.loads(Path(record).read_text())['downloaderEntitlements'])
              else: raise ValueError('unknown Downloader command')
          # END downloader.py
          SOURCE
      - name: Validate and unpack frozen unsigned payload
        env:
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle-identifier }}
          MINIMUM_SYSTEM_VERSION: ${{ inputs.minimum-system-version }}
          SPARKLE_PUBLIC_KEY: ${{ inputs.sparkle-public-key }}
          APPCAST_FEED_URL: ${{ inputs.appcast-feed-url }}
          CLI_BINARY_NAME: ${{ inputs.cli-binary-name }}
          CLI_IDENTIFIER: ${{ inputs.cli-identifier }}
          CLI_ARCHIVE_PREFIX: ${{ inputs.cli-archive-prefix }}
          REPOSITORY_TYPE: ${{ inputs.repository-type }}
          VERSION: ${{ needs.validate.outputs.release-version }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
          DMG_LAYOUT: ${{ inputs.dmg-layout }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sparkle-tools/unpack.py" raw/app.zip unsigned "$APP_NAME.app" zip
          python3 "$RUNNER_TEMP/sparkle-tools/metadata.py" "unsigned/$APP_NAME.app"
          python3 "$RUNNER_TEMP/sparkle-tools/signing.py" "unsigned/$APP_NAME.app" >/dev/null
          python3 "$RUNNER_TEMP/sparkle-tools/downloader.py" capture "unsigned/$APP_NAME.app" "$RUNNER_TEMP/downloader-entitlements.json"
          if [[ -n "$CLI_BINARY_NAME" ]]; then
            python3 "$RUNNER_TEMP/sparkle-tools/unpack.py" raw/cli.tar.gz cli-unsigned sparkle-cli tar
          fi
          python3 - <<'PYCODE'
          import os,sys,plistlib,struct
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from contract import require,layout
          for name in ('app.entitlements','background.png','appcast.xml','RELEASE-NOTES.md'):
              p=Path('frozen-inputs')/name
              require(p.is_file() and not p.is_symlink(),'invalid frozen data file')
          require(isinstance(plistlib.loads(Path('frozen-inputs/app.entitlements').read_bytes()),dict),'invalid entitlements')
          png=Path('frozen-inputs/background.png').read_bytes()
          require(png[:8]==b'\x89PNG\r\n\x1a\n' and png[12:16]==b'IHDR','background must be PNG')
          require(list(struct.unpack('>II',png[16:24]))==layout(os.environ['DMG_LAYOUT'])['window-size'],'background dimensions must match window-size')
          PYCODE
      - name: Install checksum-pinned release tools
        env:
          SPARKLE_VERSION: ${{ inputs.sparkle-version }}
        run: |
          set -euo pipefail
          case "$SPARKLE_VERSION" in
            2.10.0) sha=c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c ;;
            *) echo 'unsupported checksum-pinned Sparkle version' >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle-bin"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-bin" ./bin/sign_update
          cat >"$RUNNER_TEMP/dmg-requirements.txt" <<'REQ'
          dmgbuild==1.6.7 --hash=sha256:37ee5771c377beb3203d9164aae8046ffed8531c06edf9227f5788b3c599b1bf
          ds-store==1.3.3 --hash=sha256:b92a371efbf1b4ccce2a04d1ed13fceacc4736c81ba09cf5aefb74c088160a35
          mac-alias==2.2.3 --hash=sha256:7362b521d2132ef92f606a37abfed5fcd849ceb2f28b6f9743e014b02af92f0d
          REQ
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/python" -m pip --isolated install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/dmg-requirements.txt"
      - name: Import policy signer into ephemeral keychain
        id: signer
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          REPOSITORY_TYPE: ${{ inputs.repository-type }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sparkle-release.keychain-db"
          password=$(openssl rand -hex 32)
          p12="$RUNNER_TEMP/sparkle-release.p12"
          certificate="$RUNNER_TEMP/sparkle-release-certificate.pem"
          private_key="$RUNNER_TEMP/sparkle-release-private-key.pem"
          trap 'rm -f "$p12" "$certificate" "$private_key"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode >"$p12"
          pkcs12_legacy=0
          if openssl pkcs12 -help 2>&1 | grep -q -- '-legacy'; then
            pkcs12_legacy=1
          fi
          extract_pkcs12() {
            if (( pkcs12_legacy )); then
              openssl pkcs12 -legacy "$@"
            else
              openssl pkcs12 "$@"
            fi
          }
          extract_pkcs12 -in "$p12" -clcerts -nokeys -out "$certificate" -passin env:P12_PASSWORD
          extract_pkcs12 -in "$p12" -nocerts -nodes -out "$private_key" -passin env:P12_PASSWORD
          chmod 600 "$p12" "$certificate" "$private_key"
          # Creating a keychain can change the search list before signer setup completes.
          original_keychains=$(security list-keychains -d user)
          printf '%s\n' "$original_keychains" | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' >"$RUNNER_TEMP/sparkle-original-keychains.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain"
          security import "$private_key" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          if [[ "$REPOSITORY_TYPE" == openclaw ]]; then
            team=FWJYW4S8P8
            authority="Developer ID Application: OpenClaw Foundation ($team)"
          else
            team=Y5PE65HELJ
            authority="Developer ID Application: Peter Steinberger ($team)"
          fi
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v authority="$authority" 'index($0, "\"" authority "\"") && $2 ~ /^[0-9A-Fa-f]{40}$/ { print $2; exit }')
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "required signing identity missing: $authority" >&2; exit 1; }
          {
            echo "authority=$authority"
            echo "identity=$identity"
            echo "keychain=$keychain"
            echo "team=$team"
          } >>"$GITHUB_OUTPUT"
          rm -f "$p12"
      - name: Sign app inside out and notarize release payload
        env:
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle-identifier }}
          MINIMUM_SYSTEM_VERSION: ${{ inputs.minimum-system-version }}
          SPARKLE_PUBLIC_KEY: ${{ inputs.sparkle-public-key }}
          APPCAST_FEED_URL: ${{ inputs.appcast-feed-url }}
          CLI_BINARY_NAME: ${{ inputs.cli-binary-name }}
          CLI_IDENTIFIER: ${{ inputs.cli-identifier }}
          CLI_ARCHIVE_PREFIX: ${{ inputs.cli-archive-prefix }}
          REPOSITORY_TYPE: ${{ inputs.repository-type }}
          VERSION: ${{ needs.validate.outputs.release-version }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target-sha }}
          DMG_LAYOUT: ${{ inputs.dmg-layout }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          IDENTITY: ${{ steps.signer.outputs.identity }}
          KEYCHAIN: ${{ steps.signer.outputs.keychain }}
          TEAM_ID: ${{ steps.signer.outputs.team }}
          AUTHORITY: ${{ steps.signer.outputs.authority }}
        run: |
          set -euo pipefail
          umask 077
          export NOTARY_KEY="$RUNNER_TEMP/sparkle-notary.p8"
          sparkle_key="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$NOTARY_KEY" "$sparkle_key"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_P8" >"$NOTARY_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" >"$sparkle_key"
          chmod 600 "$NOTARY_KEY" "$sparkle_key"
          node "$RUNNER_TEMP/sparkle-tools/sparkle.cjs" private "$sparkle_key"
          unset SPARKLE_PRIVATE_KEY ASC_PRIVATE_KEY_P8
          # Key files remain 0600; distributable files need ordinary read/execute modes.
          # BEGIN release-staging-permissions
          umask 022
          # END release-staging-permissions
          mkdir signed-assets submissions
          app="unsigned/$APP_NAME.app"
          # Seal physical Mach-O leaves and bundles from the inside out. Never sign through framework aliases.
          python3 "$RUNNER_TEMP/sparkle-tools/downloader.py" sign "$app" "$RUNNER_TEMP/downloader-entitlements.json"
          requirement="identifier \"$BUNDLE_IDENTIFIER\" and anchor apple generic and certificate leaf[subject.OU] = \"$TEAM_ID\""
          codesign --force --timestamp --options runtime --identifier "$BUNDLE_IDENTIFIER" --requirements "=designated => $requirement" --entitlements frozen-inputs/app.entitlements --keychain "$KEYCHAIN" --sign "$IDENTITY" "$app"
          codesign --verify --strict --deep -R="$requirement" "$app"
          python3 "$RUNNER_TEMP/sparkle-tools/downloader.py" verify "$app" "$RUNNER_TEMP/downloader-entitlements.json"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/app-submit.zip"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" submit "$RUNNER_TEMP/app-submit.zip" submissions/app.json
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$app"
          spctl --assess --type execute "$app"
          zip="signed-assets/$APP_NAME-$VERSION.app.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          "$RUNNER_TEMP/sparkle-bin/bin/sign_update" --ed-key-file "$sparkle_key" -p "$zip" >"$RUNNER_TEMP/ed-signature"
          node "$RUNNER_TEMP/sparkle-tools/sparkle.cjs" verify "$zip" "$(cat "$RUNNER_TEMP/ed-signature")"
          if [[ -n "$CLI_BINARY_NAME" ]]; then
            cli_dir=cli-unsigned/sparkle-cli
            python3 - "$cli_dir" <<'PYCODE'
          import os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/sparkle-tools')
          from contract import require
          root=Path(sys.argv[1]); name=os.environ['CLI_BINARY_NAME']
          for p in root.iterdir():
              require(p.is_file() and not p.is_symlink() and (p.name==name or p.suffix=='.dylib'),'unexpected CLI payload')
              require(set(subprocess.check_output(['lipo','-archs',str(p)],text=True).split())=={'arm64','x86_64'},'CLI/dylib must be universal')
              from contract import check_deployment
              check_deployment(p,os.environ['MINIMUM_SYSTEM_VERSION'])
              identifier=os.environ['CLI_IDENTIFIER'] if p.name==name else os.environ['CLI_IDENTIFIER']+'.'+p.stem
              requirement='identifier "'+identifier+'" and anchor apple generic and certificate leaf[subject.OU] = "'+os.environ['TEAM_ID']+'"'
              subprocess.run(['codesign','--force','--timestamp','--options','runtime','--identifier',identifier,'--requirements','=designated => '+requirement,'--keychain',os.environ['KEYCHAIN'],'--sign',os.environ['IDENTITY'],str(p)],check=True)
          require((root/name).is_file(),'CLI binary missing')
          PYCODE
            /usr/bin/ditto -c -k "$cli_dir" "$RUNNER_TEMP/cli-submit.zip"
            python3 "$RUNNER_TEMP/sparkle-tools/notary.py" submit "$RUNNER_TEMP/cli-submit.zip" submissions/cli.json
            for file in "$cli_dir"/*; do python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$file"; done
            mkdir cli-staging
            for arch in universal arm64 x86_64; do
              dir="cli-staging/$CLI_ARCHIVE_PREFIX-$arch"
              mkdir "$dir"
              for file in "$cli_dir"/*; do
                name=${file##*/}
                if [[ "$arch" == universal ]]; then cp "$file" "$dir/$name"; else
                  lipo "$file" -thin "$arch" -output "$dir/$name"
                  chmod "$(stat -f%Lp "$file")" "$dir/$name"
                fi
                codesign --verify --strict "$dir/$name"
                python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$dir/$name"
              done
              cp frozen-inputs/LICENSE "$dir/LICENSE"
              printf '%s\n' "$VERSION" >"$dir/VERSION"
              printf '# %s CLI %s\n\nArchitecture: %s. Install %s and its companion dylibs together.\n' "$APP_NAME" "$VERSION" "$arch" "$CLI_BINARY_NAME" >"$dir/README.md"
              COPYFILE_DISABLE=1 tar -czf "signed-assets/$CLI_ARCHIVE_PREFIX-$arch.tar.gz" -C cli-staging "$CLI_ARCHIVE_PREFIX-$arch"
            done
          fi
          dmg="signed-assets/$APP_NAME-$VERSION.dmg"
          volume=$(python3 -c 'import json,os; print(json.loads(os.environ["DMG_LAYOUT"])["volume-name"])')
          env -u ASC_KEY_ID -u ASC_ISSUER_ID "$RUNNER_TEMP/dmg-venv/bin/python" -m dmgbuild --no-hidpi --detach-retries 5 --settings "$RUNNER_TEMP/sparkle-tools/dmg-settings.py" -D "app_name=$APP_NAME" -D "app_path=$PWD/$app" -D "background=$PWD/frozen-inputs/background.png" -D "layout=$DMG_LAYOUT" "$volume" "$dmg"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" submit "$dmg" submissions/dmg.json
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          python3 "$RUNNER_TEMP/sparkle-tools/notary.py" ticket "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          python3 - <<'PYCODE'
          import os,json,hashlib,plistlib
          from pathlib import Path
          e=os.environ; root=Path('signed-assets')
          info=plistlib.loads((Path('unsigned')/(e['APP_NAME']+'.app')/'Contents/Info.plist').read_bytes())
          data={'schemaVersion':1,'repository':e['GITHUB_REPOSITORY'],'tag':e['TAG'],'commit':e['TARGET_SHA'],'teamId':e['TEAM_ID'],'authority':e['AUTHORITY'],'toolchain':{'build':json.loads(Path('raw/build-toolchain.json').read_text()),'sign':json.loads(Path(e['RUNNER_TEMP'],'toolchain.json').read_text())},'submissions':{p.stem:json.loads(p.read_text())['id'] for p in Path('submissions').glob('*.json')},'buildNumber':str(info['CFBundleVersion']),'edSignature':Path(e['RUNNER_TEMP'],'ed-signature').read_text().strip(),'digests':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}}
          data['downloaderEntitlements']=json.loads(Path(e['RUNNER_TEMP'],'downloader-entitlements.json').read_text())
          (root/'SIGNING-MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          PYCODE
          # The transport tar preserves executable modes; only release assets are published.
          COPYFILE_DISABLE=1 tar -czf signed-sparkle.tar.gz signed-assets
      - name: Upload signed-sparkle-${{ github.run_id }}-${{ github.run_attempt }}
        id: signed-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-sparkle-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-sparkle.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Export signed payload name
        id: name
        run: |
          echo "artifact-name=signed-sparkle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Restore signing keychain
        if: always()
        run: |
          set -euo pipefail
          cleanup_failed=0
          search_list_file="$RUNNER_TEMP/sparkle-original-keychains.txt"
          if [[ -f "$search_list_file" ]]; then
            # Positional parameters also handle an empty list under Bash 3 nounset.
            set --
            while IFS= read -r existing; do
              [[ -z "$existing" ]] || set -- "$@" "$existing"
            done <"$search_list_file"
            if ! security list-keychains -d user -s "$@"; then
              echo "could not restore user keychain search list" >&2
              cleanup_failed=1
            fi
          fi
          # Failed imports may never export signer outputs.
          keychain="$RUNNER_TEMP/sparkle-release.keychain-db"
          if [[ -e "$keychain" ]] && ! security delete-keychain "$keychain"; then
            echo "could not delete ephemeral signing keychain" >&2
            cleanup_failed=1
          fi
          rm -f "$search_list_file" "$RUNNER_TEMP/sparkle-notary.p8" "$RUNNER_TEMP/sparkle-private-key"
          exit "$cleanup_failed"
  package:
    name: 4 · Package signed assets and appcast
    needs:
      - validate
      - sign
    runs-on: ${{ inputs.build-runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.name.outputs.artifact-name }}
      artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    steps:
      - name: Check out frozen npm packaging source
        if: ${{ inputs.npm-pack-script != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.target-sha }}
          submodules: recursive
          persist-credentials: false
          path: source
      - name: Download ${{ needs.sign.outputs.artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          merge-multiple: true
      - name: Download ${{ needs.validate.outputs.release-notes-artifact-name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate.outputs.frozen-inputs-id }}
          merge-multiple: true
          path: frozen-inputs
      - name: Pack npm with the signed universal CLI
        if: ${{ inputs.npm-pack-script != '' }}
        env:
          NPM_PACK_SCRIPT: ${{ inputs.npm-pack-script }}
          CLI_ARCHIVE_PREFIX: ${{ inputs.cli-archive-prefix }}
        run: |
          set -euo pipefail
          tar -xzf signed-sparkle.tar.gz
          mkdir -p source/dist/sparkle-cli
          # The established handoff path contains the signed universal CLI and companions.
          tar -xzf "signed-assets/$CLI_ARCHIVE_PREFIX-universal.tar.gz" -C source/dist/sparkle-cli --strip-components=1
          cd source
          "./$NPM_PACK_SCRIPT"
      - name: Prepare workflow-owned release tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          cat >"$RUNNER_TEMP/sparkle-tools/contract.py" <<'SOURCE'
          # BEGIN contract.py
          import base64, json, os, re, struct
          from pathlib import Path, PurePosixPath

          def require(ok, message):
              if not ok: raise ValueError(message)
          def cli_version_matches(output, expected):
              versions=re.findall(r'(?<![0-9A-Za-z.+-])v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)(?![0-9A-Za-z.+-])',output)
              return versions == [expected]
          def safe_path(value):
              require(bool(re.fullmatch(r'[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*', value)), 'unsafe repo-relative path')
              require(all(part not in ('', '.', '..') for part in value.split('/')), 'unsafe path component')
          def safe_name(value):
              require(bool(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,180}', value)) and not value.endswith('.'), 'unsafe asset name')
          def json_input(value,label):
              try: return json.loads(value)
              except ValueError: raise ValueError(label+' must be valid JSON') from None
          def layout(value):
              d=json_input(value,'dmg-layout')
              require(isinstance(d,dict) and set(d)=={'window-size','icon-size','app-position','applications-position','volume-name'}, 'invalid dmg-layout keys')
              for key in ('window-size','app-position','applications-position'):
                  require(isinstance(d[key],list) and len(d[key])==2 and all(type(v) is int and 0 <= v <= 4096 for v in d[key]), 'invalid layout pair')
              w,h=d['window-size']
              require(w>=200 and h>=200, 'invalid window size')
              require(type(d['icon-size']) is int and 16<=d['icon-size']<=512, 'invalid icon size')
              for key in ('app-position','applications-position'):
                  require(0 < d[key][0] < w and 0 < d[key][1] < h, 'icon outside window')
              require(isinstance(d['volume-name'],str) and 0<len(d['volume-name'])<=80 and not re.search(r'[/\\:\x00-\x1f\x7f]',d['volume-name']), 'invalid volume name')
              return d

          def tree(root):
              root=Path(root)
              require(root.is_dir() and not root.is_symlink(), 'invalid tree root')
              resolved=root.resolve()
              seen=set()
              for parent, dirs, files in os.walk(root,followlinks=False):
                  for name in dirs+files:
                      p=Path(parent)/name
                      rel=p.relative_to(root).as_posix()
                      import unicodedata
                      key=unicodedata.normalize('NFD',rel).casefold()
                      require(key not in seen and not re.search(r'[\x00-\x1f\x7f\\]',rel), 'ambiguous tree member')
                      seen.add(key)
                      if p.is_symlink(): require(p.resolve(strict=True).is_relative_to(resolved), 'symlink escapes tree')
                      else: require(p.is_file() or p.is_dir(), 'special file in tree')

          def check_deployment(binary, maximum):
              import subprocess
              def version(value): return tuple((list(map(int,value.split('.')))+[0,0,0])[:3])
              for arch in subprocess.check_output(['lipo','-archs',str(binary)],text=True).split():
                  output=subprocess.check_output(['otool','-arch',arch,'-l',str(binary)],text=True)
                  minima=[]
                  for block in re.split(r'(?m)^\s*cmd ',output)[1:]:
                      kind=block.splitlines()[0].strip()
                      if kind not in ('LC_BUILD_VERSION','LC_VERSION_MIN_MACOSX'):continue
                      fields=dict(re.findall(r'(?m)^\s*(platform|minos|version)\s+(\S+)\s*$',block))
                      if kind=='LC_BUILD_VERSION':
                          platform=fields.get('platform','').lower()
                          # Zippered dylibs also describe Catalyst, whose minimum is iOS-numbered.
                          if platform in ('6','maccatalyst'):continue
                          require(platform in ('1','macos'),'non-macOS Mach-O platform')
                      value=fields.get('minos' if kind=='LC_BUILD_VERSION' else 'version','')
                      require(bool(re.fullmatch(r'[0-9]+(?:\.[0-9]+)*',value)),'missing Mach-O minimum OS')
                      minima.append(version(value))
                  require(bool(minima) and max(minima)<=version(maximum),'Mach-O requires newer macOS than minimum-system-version')

          if __name__=='__main__':
              e=os.environ
              version=e['VERSION'].removeprefix('v')
              require(bool(re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.(0|[1-9][0-9]*))?',version)), 'invalid SemVer')
              require(e['REPOSITORY_TYPE'] in ('openclaw','personal'), 'invalid repository-type')
              require(e['BUILD_RUNNER'] in ('xcode-27','macos-15','macos-15-intel','macos-26'), 'unsupported build-runner')
              require(bool(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9 _-]{0,79}', e['SIGNING_ENVIRONMENT'])), 'invalid signing-environment')
              if e['XCODE_PATH']: require(bool(re.fullmatch(r'/Applications/Xcode[A-Za-z0-9._ -]*\.app/Contents/Developer',e['XCODE_PATH'])), 'invalid Xcode developer path')
              for name in ('APP_NAME','CHECKSUM_FILENAME'): safe_name(e[name])
              require(bool(e['BUNDLE_IDENTIFIER']), 'bundle-identifier is required')
              for name in ('BUNDLE_IDENTIFIER','CLI_IDENTIFIER'):
                  if e[name]: require(bool(re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', e[name])), 'invalid signing identifier')
              for name in ('APP_BUILD_SCRIPT','APP_ENTITLEMENTS','APPCAST_PATH','DMG_BACKGROUND'): safe_path(e[name])
              for name in ('CLI_BUILD_SCRIPT','NPM_PACK_SCRIPT','NPM_PUBLISH_WORKFLOW','HOMEBREW_WORKFLOW'):
                  if e[name]: safe_path(e[name])
              for name in ('NPM_PUBLISH_WORKFLOW','HOMEBREW_WORKFLOW'):
                  if e[name]: require('/' not in e[name] and e[name].endswith(('.yml','.yaml')), 'handoff must name a workflow file')
              cli=bool(e['CLI_BUILD_SCRIPT'])
              require(all(bool(e[k])==cli for k in ('CLI_BINARY_NAME','CLI_IDENTIFIER','CLI_ARCHIVE_PREFIX')), 'CLI inputs must be supplied together')
              for key in ('CLI_BINARY_NAME','CLI_ARCHIVE_PREFIX'):
                  if cli: safe_name(e[key])
              require(not e['NPM_PACK_SCRIPT'] or cli, 'npm packing requires CLI')
              require(not e['NPM_PUBLISH_WORKFLOW'] or e['NPM_PACK_SCRIPT'], 'npm publication requires npm pack')
              require(bool(re.fullmatch(r'(?:[0-9]+\.){1,2}[0-9]+',e['MINIMUM_SYSTEM_VERSION'])), 'invalid minimum-system-version')
              require(tuple(map(int,e['MINIMUM_SYSTEM_VERSION'].split('.'))) <= (15,0,0), 'minimum macOS must be at most 15.0')
              key=base64.b64decode(e['SPARKLE_PUBLIC_KEY'],validate=True)
              require(len(key)==32 and base64.b64encode(key).decode()==e['SPARKLE_PUBLIC_KEY'], 'invalid Sparkle public key')
              from urllib.parse import urlsplit
              url=urlsplit(e['APPCAST_FEED_URL'])
              require(url.scheme=='https' and bool(url.hostname) and not url.username and not url.password and not url.fragment and not re.search(r'[\x00-\x20\x7f]',e['APPCAST_FEED_URL']), 'invalid appcast-feed-url')
              require(e['SPARKLE_VERSION']=='2.10.0', 'unsupported checksum-pinned Sparkle version')
              events=json_input(e['CI_CHECK_EVENTS'],'ci-check-events')
              require(isinstance(events,list) and all(isinstance(x,str) and re.fullmatch('[a-z][a-z0-9_]*',x) for x in events) and len(events)==len(set(events)), 'invalid CI events')
              args=json_input(e['CLI_SMOKE_ARGS'],'cli-smoke-args')
              require(isinstance(args,list) and all(isinstance(x,str) and not re.search(r'[\x00-\x1f]',x) for x in args), 'cli-smoke-args must be a JSON argv array')
              layout(e['DMG_LAYOUT'])
              names=['ASSET-INVENTORY.json','RELEASE-NOTES.md','SIGNING-MANIFEST.json','appcast.xml','appcast-entry.json',f'{e["APP_NAME"]}-{version}.app.zip',f'{e["APP_NAME"]}-{version}.dmg']
              if cli: names += [e['CLI_ARCHIVE_PREFIX']+'-'+a+'.tar.gz' for a in ('universal','arm64','x86_64')]
              require(e['CHECKSUM_FILENAME'].casefold() not in {x.casefold() for x in names}, 'checksum-filename collides with release asset')
              with open(e['GITHUB_OUTPUT'],'a') as output: output.write(f'release-version={version}\ntag=v{version}\n')
