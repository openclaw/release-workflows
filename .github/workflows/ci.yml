name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Validate workflows
        run: scripts/validate-workflows.sh

  action-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release tool defaults
        id: defaults
        run: |
          ruby -rpsych -e '
            workflow = Psych.safe_load(File.read(".github/workflows/release-electron.yml"))
            # Psych reads the unquoted YAML 1.1 key on as true.
            inputs = workflow.fetch(true).fetch("workflow_call").fetch("inputs")
            %w[node-version pnpm-version goreleaser-version].each do |name|
              puts "#{name}=#{inputs.fetch(name).fetch("default")}"
            end
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ steps.defaults.outputs.pnpm-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.defaults.outputs.node-version }}
          package-manager-cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.defaults.outputs.goreleaser-version }}
          install-only: true
      - name: Build and run an unsigned snapshot
        run: scripts/smoke-release-build.sh
      - name: Upload named payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: README.md
          if-no-files-found: error
          retention-days: 1
      - name: Download named payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-integration
      - name: Verify bytes and GitHub client
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const path = require('node:path');
            assert.deepEqual(
              fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'action-integration', 'README.md')),
              fs.readFileSync('README.md'),
            );
            const { data } = await github.rest.repos.get(context.repo);
            assert.equal(data.full_name, process.env.GITHUB_REPOSITORY);
            core.info('artifact round-trip bytes and github-script REST client passed');

  swift-keychain-lifecycle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise Swift keychain cleanup on native macOS
        run: node scripts/test-swift-keychain-lifecycle.mjs --real-keychains

  homebrew-preflight-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Exercise real GitHub preflight errors without dispatch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./scripts/smoke-homebrew-preflight.cjs')({ github, core });
